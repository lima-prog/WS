<script>
/* ============================================================================================
   RELATÓRIO DE ORDENS x FLUXOS — núcleo (mesmas regras do Roteirizador DXF PROJEART v19.4)
   Tradução fiel das funções Python da aba "Relatório de Ordens". Os nomes das funções são os
   mesmos do Python para facilitar a conferência. Usa SheetJS (XLSX) para ler e ExcelJS para gravar.
   ============================================================================================ */
var RO = (function () {
  "use strict";

  // ------------------------------------------------------------------ comportamento do Python

  function strip(s) {                                   // str.strip() do Python
    let a = 0, b = s.length;
    while (a < b && ESPACOS_PY.indexOf(s[a]) >= 0) a++;
    while (b > a && ESPACOS_PY.indexOf(s[b - 1]) >= 0) b--;
    return s.slice(a, b);
  }
  class PyDate {                                        // data/hora vinda do Excel (datetime do Python)
    constructor(y, m, d, H, M, S) { this.y = y; this.m = m; this.d = d; this.H = H || 0; this.M = M || 0; this.S = S || 0; }
    toString() {
      const p = (n, k) => String(n).padStart(k || 2, "0");
      return `${p(this.y, 4)}-${p(this.m)}-${p(this.d)} ${p(this.H)}:${p(this.M)}:${p(this.S)}`;
    }
    toDateUTC() { return new Date(Date.UTC(this.y, this.m - 1, this.d, this.H, this.M, this.S)); }
  }
  function reprFloat(x) {                               // repr(float) do Python
    if (Number.isNaN(x)) return "nan";
    if (!Number.isFinite(x)) return x > 0 ? "inf" : "-inf";
    if (x === 0) return Object.is(x, -0) ? "-0.0" : "0.0";
    const exp = x.toExponential();                      // dígitos mínimos (ida e volta)
    const m = exp.match(/^(-?)(\d)(?:\.(\d+))?e([+-]\d+)$/);
    const sinal = m[1], dig = m[2] + (m[3] || ""), e = parseInt(m[4], 10);
    if (e >= -4 && e < 16) {
      let s;
      if (e >= 0) {
        const int = dig.length > e + 1 ? dig.slice(0, e + 1) : dig + "0".repeat(e + 1 - dig.length);
        const frac = dig.length > e + 1 ? dig.slice(e + 1) : "";
        s = int + "." + (frac || "0");
      } else {
        s = "0." + "0".repeat(-e - 1) + dig;
      }
      return sinal + s;
    }
    const mant = dig.length > 1 ? dig[0] + "." + dig.slice(1) : dig;
    return sinal + mant + "e" + (e < 0 ? "-" : "+") + String(Math.abs(e)).padStart(2, "0");
  }
  function pyStr(v) {                                   // str(v) para os valores lidos do relatório
    if (v === null || v === undefined) return "None";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (typeof v === "number") return Number.isInteger(v) && Math.abs(v) < 1e16 ? String(v) : reprFloat(v);
    return String(v);
  }
  function floatStr(x) { return reprFloat(x); }         // str() de um float (ex.: espessura 3.0 -> "3.0")
  function T(v) {                                       // bool(v) do Python
    if (v === null || v === undefined) return false;
    if (typeof v === "boolean") return v;
    if (typeof v === "number") return v !== 0;
    if (typeof v === "string" || Array.isArray(v)) return v.length > 0;
    if (v instanceof Map || v instanceof Set) return v.size > 0;
    return true;
  }
  function OU() { for (let i = 0; i < arguments.length - 1; i++) if (T(arguments[i])) return arguments[i]; return arguments[arguments.length - 1]; }
  // decimal exato de um double (para arredondar igual ao Python: metade vai para o par)
  function decimalExato(x) {
    const buf = new DataView(new ArrayBuffer(8)); buf.setFloat64(0, Math.abs(x));
    const hi = buf.getUint32(0), lo = buf.getUint32(4);
    const expo = (hi >>> 20) & 0x7ff;
    let mant = (BigInt(hi & 0xfffff) << 32n) | BigInt(lo);
    let e2;
    if (expo === 0) e2 = -1074; else { mant |= 1n << 52n; e2 = expo - 1075; }
    let inteiro, frac = "";
    if (e2 >= 0) inteiro = (mant << BigInt(e2)).toString();
    else {
      const k = -e2, num = mant * (5n ** BigInt(k)), s = num.toString().padStart(k + 1, "0");
      inteiro = s.slice(0, s.length - k); frac = s.slice(s.length - k);
    }
    return { neg: x < 0 || Object.is(x, -0), inteiro, frac };
  }
  function fixo(x, casas) {                             // f"{x:.Nf}" do Python (texto)
    if (!Number.isFinite(x)) return reprFloat(x);
    const d = decimalExato(x);
    let frac = d.frac.padEnd(casas + 1, "0");
    let manter = BigInt(d.inteiro + frac.slice(0, casas));
    const resto = d.frac.slice(casas);
    const prim = resto.length ? resto.charCodeAt(0) - 48 : 0;
    const depois = /[1-9]/.test(resto.slice(1));
    if (prim > 5 || (prim === 5 && (depois || manter % 2n === 1n))) manter += 1n;
    let s = manter.toString().padStart(casas + 1, "0");
    s = casas ? s.slice(0, s.length - casas) + "." + s.slice(s.length - casas) : s;

  function pyRound(x, casas) { return Number(fixo(x, casas)); }
  // comparação de tuplas como no Python (texto por ponto de código)
  function cmpStr(a, b) {
    if (a === b) return 0;
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) {
      const ca = a.codePointAt(i), cb = b.codePointAt(i);

      if (ca > 0xffff) i++;

    return a.length < b.length ? -1 : a.length > b.length ? 1 : 0;

    if (Array.isArray(a)) {
      for (let i = 0; i < Math.min(a.length, b.length); i++) { const c = cmpVal(a[i], b[i]); if (c) return c; }
      return a.length - b.length;
    }
    if (typeof a === "string" && typeof b === "string") return cmpStr(a, b);
    if (typeof a === "boolean") a = a ? 1 : 0;
    if (typeof b === "boolean") b = b ? 1 : 0;
    if (typeof a === "number" && typeof b === "number") return a < b ? -1 : a > b ? 1 : 0;
    throw new TypeError("comparação entre tipos diferentes: " + typeof a + " x " + typeof b);
  }
  const ordenar = (lista, chave) => lista.map((v, i) => [chave(v), i, v]).sort((x, y) => cmpVal(x[0], y[0]) || x[1] - y[1]).map(x => x[2]);
  const unicos = arr => Array.from(new Set(arr));
  function splitN(s, sep, n) {                          // s.split(sep, n) do Python
    const out = []; let resto = s;
    while (out.length < n) { const i = resto.indexOf(sep); if (i < 0) break; out.push(resto.slice(0, i)); resto = resto.slice(i + sep.length); }
    out.push(resto); return out;
  }

  const reB = (corpo, flags) => new RegExp(corpo.replace(/\\b/g, "(?:(?<!" + W + ")(?=" + W + ")|(?<=" + W + ")(?!" + W + "))"), (flags || "") + "u");

  const _SUBPASTAS_AUXILIARES_FLUXO = new Set(["editar", "banco de corte"]);
  const _PREFIXOS_NOME_DE_FLUXO = ["fluxo ", "terça z", "terca z", "perfiladeira u e c", "perfiladeira l",
    "acessórios padrão", "acessorios padrao", "joist ", "laser"];
  const _ALIASES_FOCCO = [
    ["lote", ["LOTE OF", "PACOTE", "LOTE"]], ["num_ordem", ["NUM ORDEM", "ORDEM", "NUM ORD", "NUMERO ORDEM"]],
    ["tp_ord", ["TP ORD", "TIPO ORDEM", "TIPO ORD"]], ["dt_emissao", ["DT EMISSAO", "DATA EMISSAO", "DT EMISSAO ORDEM"]],
    ["obra", ["OBRA", "COD OBRA"]], ["sub_trecho", ["SUB TRECHO", "SUBTRECHO"]], ["posicao", ["POSICAO", "POS", "POSICAO PECA"]],
    ["marca", ["MARCA"]], ["mascara", ["MASCARA"]], ["desc_demanda", ["DESC TECNICA DEMANDA"]], ["nome_perfil", ["NOME PERFIL"]],
    ["cod_item_demanda", ["COD ITEM DEMANDA"]], ["qtde_demanda", ["QTDE DEMANDA"]], ["cod_item", ["COD ITEM"]],

  const _MAQUINAS_POR_FLUXO = {

<script>
(function () {
  "use strict";
  RO.XLSX = window.XLSX; RO.ExcelJS = window.ExcelJS; RO.JSZip = window.JSZip;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let focco = null;                 // { nome, bytes }
  let pastas = [];                  // [{ nome, arquivos:[{partes, nome, ler}] }]
  let resultado = null;
  let gerando = false;

  // ---------------- 1. relatório do Focco
  async function escolherFocco(file) {
    if (!file) return;
    const bytes = new Uint8Array(await file.arrayBuffer());
    focco = { nome: file.name, bytes };
    $("nome-focco").textContent = file.name;
    atualizar();
  }
  $("in-focco").addEventListener("change", e => { escolherFocco(e.target.files[0]); });
  $("limpar-focco").addEventListener("click", () => { focco = null; $("in-focco").value = ""; $("nome-focco").textContent = "Nenhum arquivo escolhido"; atualizar(); });

  // ---------------- 2. pastas dos DXF
  const ehDxf = n => /\.dxf$/i.test(n);
  function adicionarPasta(nome, arquivos) {
    const dxf = arquivos.filter(a => ehDxf(a.nome));
    const igual = pastas.find(p => p.nome === nome && p.arquivos.length === dxf.length);
    if (igual) { alert(`A pasta "${nome}" já está na lista.`); return; }
    pastas.push({ nome, arquivos: dxf });
    desenharPastas(); atualizar();
  }
  function desenharPastas() {
    const ul = $("lista-pastas");
    if (!pastas.length) { ul.innerHTML = '<li class="vazio">Nenhuma pasta adicionada</li>'; return; }
    ul.innerHTML = pastas.map((p, i) => `<li><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#0b5cad" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>` +
      `<span class="n" title="${esc(p.nome)}">${esc(p.nome)}</span><span class="q">${p.arquivos.length} DXF</span>` +
      `<button type="button" data-i="${i}" title="Remover esta pasta" aria-label="Remover ${esc(p.nome)}">×</button></li>`).join("");
  }
  $("lista-pastas").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    pastas.splice(+b.dataset.i, 1); desenharPastas(); atualizar();
  });
  $("limpar-pastas").addEventListener("click", () => { pastas = []; desenharPastas(); atualizar(); });
  $("in-pasta").addEventListener("change", e => {
    const porRaiz = new Map();
    for (const f of e.target.files) {
      const partes = (f.webkitRelativePath || f.name).split("/");
      const raiz = partes.length > 1 ? partes[0] : "Arquivos avulsos";
      if (!porRaiz.has(raiz)) porRaiz.set(raiz, []);
      porRaiz.get(raiz).push({ partes: partes.slice(1, -1), nome: f.name, ler: () => f.arrayBuffer().then(b => new Uint8Array(b)) });
    }
    for (const [raiz, arqs] of porRaiz) adicionarPasta(raiz, arqs);
    e.target.value = "";
  });
  // arrastar pastas: lê a árvore inteira (FileSystemEntry)
  const lerEntradas = leitor => new Promise((ok, erro) => leitor.readEntries(ok, erro));
  async function percorrer(dir, partes, saida) {
    const leitor = dir.createReader();
    for (;;) {
      const lote = await lerEntradas(leitor);
      if (!lote.length) break;
      for (const ent of lote) {
        if (ent.isDirectory) await percorrer(ent, partes.concat([ent.name]), saida);
        else if (ehDxf(ent.name)) saida.push({ partes, nome: ent.name, ler: () => new Promise((ok, erro) => ent.file(f => f.arrayBuffer().then(b => ok(new Uint8Array(b)), erro), erro)) });
      }
    }
  }
  function prepararSoltar(dz, aoSoltar) {
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag-over"));
    dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag-over"); aoSoltar(e.dataTransfer); });
  }
  prepararSoltar($("dz-focco"), dt => {
    const f = Array.from(dt.files).find(x => !ehDxf(x.name)) || dt.files[0];
    if (f) escolherFocco(f);
  });
  prepararSoltar($("dz-pastas"), async dt => {
    const entradas = Array.from(dt.items || []).map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    const soltos = [];
    $("status").textContent = "Lendo as pastas...";
    for (const ent of entradas) {
      if (ent.isDirectory) { const arqs = []; await percorrer(ent, [], arqs); adicionarPasta(ent.name, arqs); }
      else if (ehDxf(ent.name)) soltos.push({ partes: [], nome: ent.name, ler: () => new Promise((ok, erro) => ent.file(f => f.arrayBuffer().then(b => ok(new Uint8Array(b)), erro), erro)) });
      else if (!focco) { ent.file(f => escolherFocco(f)); }
    }
    if (soltos.length) adicionarPasta("Arquivos avulsos", soltos);
    atualizar();
  });

  // ---------------- 3. gerar
  function atualizar() {
    const pronto = !!focco && pastas.length > 0;
    $("btn-gerar").disabled = !pronto || gerando;
    if (gerando) return;
    const st = $("status"); st.className = "";
    if (!focco && !pastas.length) st.textContent = "Escolha o relatório do Focco e ao menos uma pasta de DXF.";
    else if (!focco) st.textContent = "Falta o relatório do Focco.";
    else if (!pastas.length) st.textContent = "Adicione ao menos uma pasta com os DXF roteirizados.";
    else { const n = pastas.reduce((s, p) => s + p.arquivos.length, 0); st.textContent = `Pronto: ${n} DXF em ${pastas.length} pasta(s).`; }
  }
  function escreverLog(texto) {
    const div = $("log"); div.style.display = "block";
    const cls = /^\s*(✅)/.test(texto) ? "ok" : /^\s*(❌)/.test(texto) ? "erro" : /^\s*(⚠)/.test(texto) ? "aviso" : "";
    const ln = document.createElement("div"); if (cls) ln.className = cls; ln.textContent = texto;
    div.appendChild(ln); div.scrollTop = div.scrollHeight;
  }
  const progresso = pct => { $("barra").style.display = "block"; $("barra-fill").style.width = pct + "%"; };
  $("btn-gerar").addEventListener("click", async () => {
    if (gerando) return;
    if (!focco) { alert("Selecione ou arraste o arquivo do relatório do Focco (Relatório de Ordens Liberadas x Demandas)."); return; }
    if (!pastas.length) { alert("Adicione ao menos uma pasta com os DXF roteirizados."); return; }
    gerando = true; resultado = null; atualizar();
    $("log").innerHTML = ""; $("error-msg").style.display = "none"; $("resultado").style.display = "none";
    const st = $("status"); st.className = ""; st.textContent = "⚙️ Gerando relatório, aguarde...";
    progresso(2);
    try {
      const registros = await RO.coletar_registros_das_pastas(pastas, escreverLog, (i, n) => progresso(2 + Math.round(78 * i / n)));
      progresso(85);
      resultado = await RO.gerar_relatorio_ordens_fluxos(focco, registros, escreverLog);
      progresso(100);
      escreverLog(`✅ Relatório gerado: ${resultado.nome}`);
      st.className = "ok"; st.textContent = `✅ Relatório gerado: ${resultado.nome}`;
      mostrarResultado(resultado);
    } catch (ex) {
      console.error(ex);
      const msg = ex && ex.message ? ex.message : String(ex);
      escreverLog(`❌ Erro ao gerar o relatório: ${msg}`);
      st.className = "erro"; st.textContent = "❌ Erro ao gerar o relatório.";
      const box = $("error-msg"); box.textContent = "⚠ " + msg; box.style.display = "block";
      alert(msg);
    } finally {
      gerando = false; $("btn-gerar").disabled = !(focco && pastas.length);
      setTimeout(() => { $("barra").style.display = "none"; }, 600);
    }
  });
  function mostrarResultado(r) {
    const s = r.resumo;
    $("badge-lote").textContent = s.lote ? `LOTE ${s.lote}` : "LOTE —";
    const linha = (rot, q, cor) => `<tr><td>${cor ? `<span class="dot" style="background:${cor}"></span>` : ""}${rot}</td><td class="q">${Number(q).toLocaleString("pt-BR")}</td></tr>`;
    $("tb-ordens").innerHTML = linha("Com DXF", s.com_dxf, "#22c55e") + linha("Rota automática (sem DXF)", s.rota_auto, "#3b82f6") +
      linha("Sem DXF ainda", s.sem_dxf, "#ef4444") + linha("DXF sem ordem no Focco", s.sem_ordem, "#94a3b8") +
      linha("Ordens para revisar (conferência)", s.revisar, "#f59e0b") + `<tr><td><b>Total (Ordens x DXF)</b></td><td class="q">${s.linhas.toLocaleString("pt-BR")}</td></tr>`;
    $("tb-abas").innerHTML = linha("ROTEIRIZAÇÃO FOCCO", s.roteirizacao_focco) + linha("Preparação", s.preparacao) + linha("Não Preparação", s.nao_preparacao) +
      linha("PS PREP", s.ps_prep) + linha("Ordens para desconsiderar", s.desconsiderar) + linha("Preparação ainda sem fluxo", s.pendentes);
    $("nome-saida").textContent = r.nome;
    $("resultado").style.display = "block";
    $("resultado").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  $("btn-download").addEventListener("click", () => {
    if (!resultado) return;
    const blob = new Blob([resultado.buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = resultado.nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  if (!window.XLSX || !window.ExcelJS || !window.JSZip) {
    const box = $("error-msg"); box.style.display = "block";
    box.textContent = "⚠ Não foi possível carregar os componentes de planilha (internet bloqueada?). Recarregue a página.";
  }
  atualizar();
})();
<\/script>
<script>
/* ===== TEMA CINZA – troca o branco das telas por cinza claro ===== */
(function () {
  var CORES = { pagina: "#d9dee5", quadro: "#e8ebef", dentro: "#eef0f3", campo: "#f2f4f6", borda: "#c9d0d9" };
  function quaseBranco(cor, minimo) {
    minimo = minimo || 244;
    var m = cor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if (!m) return false;
    if (m[4] !== undefined && parseFloat(m[4]) < 0.9) return false;
    var r = +m[1], g = +m[2], b = +m[3];
    return Math.min(r, g, b) >= minimo && Math.max(r, g, b) - Math.min(r, g, b) <= 20;
  }
  function aplicar(raiz) {
    document.body.style.setProperty("background-color", CORES.pagina, "important");
    document.documentElement.style.setProperty("background-color", CORES.pagina, "important");
    var todos = (raiz || document.body).querySelectorAll("*");
    for (var i = 0; i < todos.length; i++) {
      var el = todos[i];
      if (el.dataset.temaCinza) continue;
      var cs = getComputedStyle(el);
      if (!quaseBranco(cs.backgroundColor)) continue;
      var tag = el.tagName, cor;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") {
        cor = CORES.campo;
      } else {
        var pai = el.parentElement, dentroDeQuadro = false;
        while (pai && pai !== document.body) {
          if (pai.dataset.temaCinza === "quadro") { dentroDeQuadro = true; break; }
          pai = pai.parentElement;
        }
        cor = dentroDeQuadro ? CORES.dentro : CORES.quadro;
        el.dataset.temaCinza = "quadro";
      }
      el.style.setProperty("background-color", cor, "important");
      if (!el.dataset.temaCinza) el.dataset.temaCinza = "campo";
      if (parseFloat(cs.borderTopWidth) > 0 && quaseBranco(cs.borderTopColor, 215)) {
        el.style.setProperty("border-color", CORES.borda, "important");
      }
    }
  }
  function iniciar() {
    aplicar();
    var espera;
    new MutationObserver(function () { clearTimeout(espera); espera = setTimeout(aplicar, 60); })
      .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();
<\/script>
