<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   UTILITÁRIOS
   ════════════════════════════════════════════════════════════════ */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = (s, el = document) => el.querySelector(s);
const tick = () => new Promise(r => setTimeout(r, 0));
const VERSAO = '2026-10-14-web';

function norm(v) {
  if (v === null || v === undefined) return '';
  let s = String(v).replace(/\u00a0/g, ' ');
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return s.replace(/\s+/g, ' ').trim().toUpperCase();
}
const squash = v => norm(v).replace(/[^A-Z0-9]/g, '');
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\\-]/g, '\\$&'); }
function extOf(nome) { const i = String(nome).lastIndexOf('.'); return i >= 0 ? nome.slice(i + 1).toLowerCase() : ''; }
function dateTag() { const d = new Date(); return String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
function vazio(v) { return v === null || v === undefined || (typeof v === 'number' && isNaN(v)); }
function parseBr(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim(); if (!s) return 0;
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  else if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s); return isFinite(n) ? n : 0;
}
function sinal(n, d) { return (n >= 0 ? '+' : '') + n.toFixed(d); }
function fmtBr(n, d = 2) { return n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function baixar(blob, nome) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
function colNum(col) { let n = 0; for (const ch of col) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
function colLetra(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function serialData(y, m, d) { return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; }
function serialHoje() { const d = new Date(); return serialData(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function cmpArr(a, b) { const n = Math.min(a.length, b.length); for (let i = 0; i < n; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return a.length - b.length; }

const SPIN = ['◐', '◓', '◑', '◒'];
async function rodar({ botoes = [], status, msg, fn, ok }) {
  botoes.forEach(b => b && (b.disabled = true));
  let q = 0, atual = msg;
  status.textContent = SPIN[0] + ' ' + msg;
  const t = setInterval(() => { status.textContent = SPIN[q++ % 4] + ' ' + atual; }, 180);
  const fim = () => { clearInterval(t); botoes.forEach(b => b && (b.disabled = false)); };
  try {
    await tick();
    const r = await fn(m => { atual = m; });
    fim();
    if (ok) await ok(r);
    return r;
  } catch (e) {
    fim(); console.error(e);
    status.textContent = '❌ ' + (e && e.message || e);
    alert('Erro: ' + (e && e.message || e));
  }
}

function escolherArquivos(accept, multi) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; if (accept) i.accept = accept; i.multiple = !!multi;
    i.onchange = () => res([...i.files]); i.click();
  });
}
function areaSoltar(el, onFiles, accept, multi = true) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); const f = [...e.dataTransfer.files]; if (f.length) onFiles(multi ? f : [f[0]]); });
  el.addEventListener('click', async () => { const f = await escolherArquivos(accept, multi); if (f.length) onFiles(f); });
}

function modal({ titulo, html, botoes = [{ txt: 'Fechar', valor: null, cls: 'principal' }] }) {
  return new Promise(res => {
    const fundo = document.createElement('div'); fundo.className = 'modal-fundo';
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<h2>${esc(titulo)}</h2><div class="corpo"></div><div class="linha" style="justify-content:flex-end;margin-top:12px"></div>`;
    const corpo = m.querySelector('.corpo');
    if (typeof html === 'string') corpo.innerHTML = html; else if (html) corpo.appendChild(html);
    const lb = m.querySelector('.linha:last-child');
    for (const b of botoes) {
      const el = document.createElement('button'); el.className = 'b ' + (b.cls || ''); el.textContent = b.txt;

function decodificarTexto(bytes) {
  let s;

  catch (e) { s = new TextDecoder('windows-1252').decode(bytes); }

}
function pareceHtml(bytes) {
  const s = new TextDecoder('latin1').decode(bytes.slice(0, 1000)).toLowerCase();
  return s.includes('<html') || s.includes('<!doctype') || s.includes('<table');
}
function htmlParaTabelas(texto) {
  const doc = new DOMParser().parseFromString(texto, 'text/html');
  const tabelas = [...doc.querySelectorAll('table')];
  const out = [];
  tabelas.forEach((t, i) => {
    const rows = [];
    for (const tr of t.rows) {
      const linha = [];
      for (const td of tr.cells) {
        td.querySelectorAll('br').forEach(br => br.replaceWith(' '));
        const tx = td.textContent.replace(/\u00a0/g, ' ').trim();
        linha.push(tx ? tx : null);
      }
      rows.push(linha);
    }
    if (rows.length) {
      const larg = Math.max(...rows.map(r => r.length));
      out.push({ nome: tabelas.length > 1 ? `Tabela ${i + 1}` : 'HTML', rows: rows.map(r => r.concat(Array(larg - r.length).fill(null))) });
    }
  });
  if (!out.length) throw new Error('nenhuma <table> encontrada no arquivo HTML');
  return out;
}
function farejarSeparador(txt) {
  const amostra = txt.split(/\r?\n/).slice(0, 10).join('\n');
  let melhor = ',', mc = -1;
  for (const d of [';', '\t', ',', '|']) { const c = amostra.split(d).length - 1; if (c > mc) { mc = c; melhor = d; } }
  return melhor;
}
function parseCSV(txt, sep) {
  const rows = []; let row = [], campo = '', aspas = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (aspas) {
      if (ch === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
      else campo += ch;
    } else if (ch === '"' && campo === '') aspas = true;
    else if (ch === sep) { row.push(campo); campo = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && txt[i + 1] === '\n') i++;
      row.push(campo); rows.push(row); row = []; campo = '';
    } else campo += ch;
  }
  if (campo !== '' || row.length) { row.push(campo); rows.push(row); }
  return rows;
}
async function lerArquivoTabular(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const ext = extOf(file.name);
  if (['xlsx', 'xlsm', 'xls', 'csv', 'txt', 'htm', 'html'].includes(ext) && pareceHtml(bytes)) return htmlParaTabelas(decodificarTexto(bytes));
  if (['csv', 'txt', 'tsv', 'prn'].includes(ext)) {
    const txt = decodificarTexto(bytes);
    return [{ nome: file.name, rows: parseCSV(txt, ext === 'tsv' ? '\t' : farejarSeparador(txt)) }];
  }
  if (['xlsx', 'xlsm', 'xls', 'xlsb', 'dbf', 'ods'].includes(ext)) {
    const wb = XLSX.read(bytes, { type: 'array', cellDates: false, cellFormula: false, cellHTML: false, cellText: false });

  }

}

function acharCabecalho(rows, chaves = CHAVES_DBF, limite = 30) {
  let melhor = -1, score = 0;
  const ks = chaves.map(squash);
  for (let i = 0; i < Math.min(limite, rows.length); i++) {
    const cel = new Set((rows[i] || []).map(squash));
    const sc = ks.filter(k => cel.has(k)).length;
    if (sc > score) { score = sc; melhor = i; }
    if (sc >= 2) break;
  }
  if (melhor >= 0 && score > 0) return melhor;
  for (let i = 0; i < Math.min(limite, rows.length); i++)
    if ((rows[i] || []).filter(v => norm(v) !== '').length >= 3) return i;
  return 0;
}
function escolherPlanilhaDbf(planilhas) {
  let melhor = null, ms = -1e9;
  for (const { nome, rows } of planilhas) {
    if (!rows || !rows.length) continue;
    const hi = acharCabecalho(rows);
    const cel = new Set((rows[hi] || []).map(squash));
    let score = CHAVES_DBF.filter(k => cel.has(squash(k))).length + Math.min(rows.length, 500) / 500;
    if (norm(nome).includes('CONSOLIDAD')) score -= 30;
    if (score > ms) { ms = score; melhor = { nome, rows, hi }; }
  }

}
function linhaEhCabecalho(row) {
  const cel = (row || []).map(squash).filter(Boolean);

}
function mapearEsquema(hdrRows) {
  const norms = hdrRows.map(h => h.map(norm)), squs = hdrRows.map(h => h.map(squash));
  const usados = new Set();
  const busca = nome => {
    const n = norm(nome), q = squash(nome);
    for (const H of norms) for (let i = 0; i < H.length; i++) if (H[i] === n && !usados.has(i)) return i;
    if (q) for (const H of squs) for (let i = 0; i < H.length; i++) if (H[i] === q && !usados.has(i)) return i;
    return -1;
  };
  return ESQUEMA_DBF.map(c => {
    let i = busca(c);
    if (i < 0) for (const a of (ALIAS_DBF[c] || [])) { i = busca(a); if (i >= 0) break; }
    if (i >= 0) usados.add(i);
    return i;
  });
}
function recuperarNumComDeData(bruto, numDis) {
  const serial = Number(bruto);

  const d = new Date(Date.UTC(1899, 11, 30) + serial * 864e5);
  const cand = `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
  return numDis && String(numDis).includes(cand) ? cand : null;
}
function normalizarDbf(rows) {

  while (p < rows.length && hdr.length < 3 && linhaEhCabecalho(rows[p])) { hdr.push((rows[p] || []).map(v => vazio(v) ? '' : String(v))); p++; }
  const mapa = mapearEsquema(hdr);
  const iNC = IE['NUM_COM'], iND = IE['NUM_DIS'];
  const idPeca = [iNC, iND, IE['MAR_PEZ'], IE['POS_PEZ'], IE['DES_PEZ']];
  const out = [];
  for (let k = p; k < rows.length; k++) {
    const r = rows[k] || [];
    if (linhaEhCabecalho(r)) continue;
    let nr = mapa.map(i => (i < 0 || i >= r.length || vazio(r[i])) ? '' : String(r[i]).trim());
    nr = nr.map(v => v.toLowerCase() === 'nan' ? '' : v);
    const rec = recuperarNumComDeData(nr[iNC], nr[iND]);
    if (rec) nr[iNC] = rec;
    if (!idPeca.some(i => nr[i].trim())) continue;

async function lerDbfs(files) {
  const entries = [];
  for (const f of files) {
    const e = { file: f, nome: f.name, status: 'lendo', rows: null, msg: '' };
    try {
      const pl = await lerArquivoTabular(f);
      const alvo = escolherPlanilhaDbf(pl);
      if (!alvo) throw new Error('nenhuma planilha com dados');
      const { rows } = normalizarDbf(alvo.rows);
      if (!rows.length) throw new Error('0 linhas de dados reconhecidas');
      e.rows = rows; e.status = 'ok'; e.msg = `${rows.length} linhas · aba "${alvo.nome}"`;
    } catch (err) { e.status = 'erro'; e.msg = err.message || String(err); }

function posBaseColapsada(pos) { let s = String(pos).split(/[@\[]/)[0].trim(); return s.replace(/_(\d+|[ULC])$/i, ''); }

async function lerRelatorioFluxos(file) {
  const pl = await lerArquivoTabular(file);
  let aba = pl.find(p => norm(p.nome) === norm('Relatório Consolidado')) || pl.find(p => norm(p.nome).includes('CONSOLIDAD'));
  if (!aba) throw new Error('não encontrei a aba "Relatório Consolidado" no relatório de fluxos');
  const rows = aba.rows, header = (rows[0] || []).map(norm);
  const iOF = header.includes('OF') ? header.indexOf('OF') : 0;
  const iPos = header.includes(norm('Posição')) ? header.indexOf(norm('Posição')) : 1;
  const iFx = header.includes('FLUXO') ? header.indexOf('FLUXO') : 3;
  const granular = {}, colapsado = {}, valores = {};
  let ignoradas = 0;
  for (const r of rows.slice(1)) {
    if (!r || !r.some(v => v !== null && v !== '')) continue;
    const of = r[iOF], pos = r[iPos], fluxo = norm(r[iFx]);
    if (!of || !pos) continue;
    const col = FLUXO_PARA_COL[fluxo];
    if (col === undefined) { ignoradas++; continue; }
    const valor = { maq: FLUXO_PARA_MAQ[fluxo], col, fluxo: r[iFx] };
    granular[`${norm(of)}|${norm(posBase(pos))}`] = valor;
    const kc = `${norm(of)}|${norm(posBaseColapsada(pos))}`;
    colapsado[kc] = valor; (valores[kc] = valores[kc] || new Set()).add(col);

}
function candidatosOfTrecho(row) {
  const c = []; const numCom = row[IE['NUM_COM']];
  if (numCom) {
    c.push(numCom);
    const sl = String(numCom).trim().replace(/_L\d+$/i, '');
    if (sl && sl !== numCom && !c.includes(sl)) c.push(sl);
  }
  const numDis = row[IE['NUM_DIS']];
  if (numDis && numCom) {
    let obra = String(numCom).trim().replace(/\.0$/, '').replace(/_L\d+$/i, '');
    if (obra) {
      const m = new RegExp(escRe(obra) + '[-_](\\d+-\\d+)').exec(String(numDis));
      if (m) { const rc = `${obra}-${m[1]}`; if (!c.includes(rc)) c.push(rc); }
    }
  }

}
function construirPosComFilhos(linhas) {
  const s = new Set();
  for (const row of linhas) {
    const pos = row[IE['POS_PEZ']];
    if (!pos || !String(pos).trim()) continue;
    if (/_\d+$/.test(posBase(String(pos).trim()))) s.add(norm(row[IE['NUM_COM']]) + '¦' + norm(posBaseColapsada(String(pos))));
  }

}
function acharFluxoDaLinha(row, fluxoMap, posComFilhos) {
  const pos = row[IE['POS_PEZ']];
  if (!pos || !pos.trim()) return null;
  const chavePos = norm(posBase(pos));
  if (MARCAS_EXCECAO_FIXA[chavePos]) return { ...MARCAS_EXCECAO_FIXA[chavePos], chave: null };
  const semSub = norm(posBase(posSemSubtrecho(pos)));
  if (MARCAS_EXCECAO_FIXA[semSub]) return { ...MARCAS_EXCECAO_FIXA[semSub], chave: null };
  if (!fluxoMap) return null;
  const granular = fluxoMap.granular || {}, colapsado = fluxoMap.colapsado || {};
  const cands = candidatosOfTrecho(row);
  for (const of of cands) { const ch = `${norm(of)}|${chavePos}`; if (granular[ch]) return { ...granular[ch], chave: ch }; }
  if (posComFilhos && !/_\d+$/.test(chavePos)) {
    if (posComFilhos.has(norm(row[IE['NUM_COM']]) + '¦' + norm(posBaseColapsada(pos)))) return null;
  }
  const pc = norm(posBaseColapsada(pos));
  for (const of of cands) { const ch = `${norm(of)}|${pc}`; if (colapsado[ch]) return { ...colapsado[ch], chave: ch }; }
  return null;

function acharCabecalhoFoco(rows, limite = 15) {
  let melhor = -1, score = 0; const ks = CHAVES_FOCCO.map(squash);
  for (let i = 0; i < Math.min(limite, rows.length); i++) {
    const cel = new Set((rows[i] || []).map(squash));
    const sc = ks.filter(k => cel.has(k)).length;
    if (sc > score) { score = sc; melhor = i; }
    if (sc >= 4) break;
  }
  if (melhor >= 0 && score >= 2) return melhor;

}
async function lerRelatorioFoco(file) {
  const rows = (await lerArquivoTabular(file))[0].rows;
  const hi = acharCabecalhoFoco(rows);
  const header = (rows[hi] || []).map(norm);
  const mapa = ESQUEMA_FOCCO.map(c => header.indexOf(norm(c)));
  const out = [];
  for (let k = hi + 1; k < rows.length; k++) {
    const r = rows[k] || [];
    const nr = mapa.map(i => (i >= 0 && i < r.length) ? r[i] : null);
    if (!nr.some(v => v !== null && v !== undefined && String(v).trim() !== '')) continue;

}
function coagirValorFoco(nomeCol, v) {
  if (vazio(v)) return null;
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  if (!s || s.toLowerCase() === 'nan') return null;
  if (DATE_COLS_FOCCO.has(nomeCol)) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(s);
    if (m) { let y = +m[3]; if (m[3].length === 2) y = y < 69 ? 2000 + y : 1900 + y; return serialData(y, +m[2], +m[1]); }
    return s;
  }

  const prefixos = [...new Set(obras.map(o => o.split('-')[0]))];
  progresso(`Verificando o atalho de ${prefixos.length} obra(s) em ${raizes.length} pasta(s) raiz…`);
  const nivel1 = await Promise.all(raizes.map(r => listarRef(r.ref)));
  const cacheRapido = new Map(), precisaLenta = new Set();
  await Promise.all(raizes.flatMap((r, ri) => prefixos.map(async pf => {
    const ent = nivel1[ri].find(e => e.kind === 'dir' && e.name.toLowerCase() === pf.toLowerCase());
    const ez = nivel1[ri].find(e => e.kind === 'file' && e.name.toLowerCase() === (pf + '.zip').toLowerCase());
    let v = null; if (ent) v = await escanearCompleto(ent.ref, ent.name); else if (ez) v = await escanearZip(ez.ref, ez.name);
    cacheRapido.set(ri + '|' + pf, v); if (v === null) precisaLenta.add(ri);
  })));
  const cacheLenta = new Map();
  if (completa && precisaLenta.size) {
    progresso(`Atalho não achou tudo — varrendo ${precisaLenta.size} pasta(s) raiz inteira(s) (pode demorar)…`);
    await Promise.all([...precisaLenta].map(async ri => cacheLenta.set(ri, await escanearCompleto(raizes[ri].ref, raizes[ri].nome))));
  }
  progresso('Cruzando resultados…');
  const encontrados = [], naoAchadas = [];
  for (const obra of obras) {
    const ol = obra.toLowerCase(), pf = obra.split('-')[0]; const cands = [];
    for (let ri = 0; ri < raizes.length; ri++) {
      const bruto = cacheRapido.get(ri + '|' + pf);
      if (bruto) { cands.push(...filtrar(bruto, ol)); continue; }
      for (const e of nivel1[ri]) {
        const ez = e.name.toLowerCase().endsWith('.zip'); const ns = ez ? e.name.slice(0, -4) : e.name;
        if (!nomeBateObra(ns, ol)) continue;
        if (e.kind === 'dir') cands.push(...filtrar(await escanearCompleto(e.ref, e.name), ol));
        else if (ez) cands.push(...filtrar(await escanearZip(e.ref, e.name), ol));
      }
      if (cacheLenta.has(ri)) cands.push(...filtrar(cacheLenta.get(ri), ol));
    }
    const ach = melhorPorArquivo(cands);
    if (ach.length) for (const c of ach) { try { encontrados.push(await c.obter()); } catch (e) { } }
    else naoAchadas.push(obra);
  }
  return { encontrados, naoAchadas };
}

function renderArvore(container, nos, aoSelecionar) {
  container.innerHTML = ''; const ul = document.createElement('ul'); let sel = null;
  const criar = n => {
    const li = document.createElement('li'); const row = document.createElement('div'); row.className = 'tn';
    const tem = n.children && n.children.length;
    const tg = document.createElement('span'); tg.className = 'tg'; tg.textContent = tem ? (n.open ? '▾' : '▸') : ''; row.appendChild(tg);
    if (n.check !== false) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; row.appendChild(cb);
      cb.addEventListener('change', () => li.querySelectorAll('input[type=checkbox]').forEach(x => x.checked = cb.checked));
    }
    const lb = document.createElement('span'); lb.textContent = n.label; if (n.cor) lb.style.color = n.cor; row.appendChild(lb);
    if (n.det) { const d = document.createElement('span'); d.className = 'det'; d.textContent = n.det; row.appendChild(d); }
    for (const a of n.acoes || []) { const b = document.createElement('button'); b.className = 'b mini'; b.textContent = a.txt; b.onclick = e => { e.stopPropagation(); a.fn(li); }; row.appendChild(b); }
    if (n.of) li.dataset.of = n.of;
    li.appendChild(row);
    let sub = null;
    if (tem) { sub = document.createElement('ul'); sub.hidden = !n.open; n.children.forEach(c => sub.appendChild(criar(c))); li.appendChild(sub); }
    tg.onclick = () => { if (!sub) return; sub.hidden = !sub.hidden; tg.textContent = sub.hidden ? '▸' : '▾'; };
    row.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT' || e.target === tg || e.target.tagName === 'BUTTON') return;
      if (sel) sel.classList.remove('sel'); sel = row; row.classList.add('sel'); if (aoSelecionar) aoSelecionar(n, li);
    });
    return li;
  };
  nos.forEach(n => ul.appendChild(criar(n))); container.appendChild(ul);
}
function ofsMarcadasSob(li) {
  const out = [];
  for (const x of [li, ...li.querySelectorAll('li[data-of]')]) {
    if (!x.dataset || !x.dataset.of) continue;
    const cb = x.querySelector(':scope > .tn > input[type=checkbox]');
    if (!cb || cb.checked) out.push(x.dataset.of);
  }
  return out;
}

<script>
/* ===== TEMA CINZA – troca o branco das telas por cinza claro ===== */
(function () {
  var CORES = { pagina: "#d9dee5", quadro: "#e8ebef", dentro: "#eef0f3", campo: "#f2f4f6", borda: "#c9d0d9" };
  function quaseBranco(cor, minimo) {
    minimo = minimo || 244;
    var m = cor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if (!m) return false;
    if (m[4] !== undefined && parseFloat(m[4]) < 0.9) return false;
    var r = +m[1], g = +m[2], b = +m[3];
    return Math.min(r, g, b) >= minimo && Math.max(r, g, b) - Math.min(r, g, b) <= 20;
  }
  function aplicar(raiz) {
    document.body.style.setProperty("background-color", CORES.pagina, "important");
    document.documentElement.style.setProperty("background-color", CORES.pagina, "important");
    var todos = (raiz || document.body).querySelectorAll("*");
    for (var i = 0; i < todos.length; i++) {
      var el = todos[i];
      if (el.dataset.temaCinza) continue;
      var cs = getComputedStyle(el);
      if (!quaseBranco(cs.backgroundColor)) continue;
      var tag = el.tagName, cor;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") {
        cor = CORES.campo;
      } else {
        var pai = el.parentElement, dentroDeQuadro = false;
        while (pai && pai !== document.body) {
          if (pai.dataset.temaCinza === "quadro") { dentroDeQuadro = true; break; }
          pai = pai.parentElement;
        }
        cor = dentroDeQuadro ? CORES.dentro : CORES.quadro;
        el.dataset.temaCinza = "quadro";
      }
      el.style.setProperty("background-color", cor, "important");
      if (!el.dataset.temaCinza) el.dataset.temaCinza = "campo";
      if (parseFloat(cs.borderTopWidth) > 0 && quaseBranco(cs.borderTopColor, 215)) {
        el.style.setProperty("border-color", CORES.borda, "important");
      }
    }
  }
  function iniciar() {
    aplicar();
    var espera;
    new MutationObserver(function () { clearTimeout(espera); espera = setTimeout(aplicar, 60); })
      .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();
<\/script>
