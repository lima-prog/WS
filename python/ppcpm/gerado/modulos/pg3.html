<script>
const ROUTE_CFG = {
  'PREPARAÇÃO':               { hdr:'1F4E79', txt:'FFFFFF', row:'BDD7EE', dot:'#3b82f6' },
  'PREPARAÇÃO (DOBRA)':       { hdr:'2E75B6', txt:'FFFFFF', row:'DEEAF1', dot:'#60a5fa' },
  'PERFILADEIRA U/C':         { hdr:'833C0B', txt:'FFFFFF', row:'FCE4D6', dot:'#f97316' },
  'PERFILADEIRA L':           { hdr:'375623', txt:'FFFFFF', row:'E2EFDA', dot:'#22c55e' },
  'PERFILADEIRA Z':           { hdr:'7030A0', txt:'FFFFFF', row:'E9D6F5', dot:'#a855f7' },
  'PERFILADEIRA BANZO JOIST': { hdr:'C55A11', txt:'FFFFFF', row:'FAD7AC', dot:'#fb923c' },
  'PERFILADEIRA U JOIST':     { hdr:'843C0C', txt:'FFFFFF', row:'F4D2C1', dot:'#c2410c' },
  'ACESSÓRIOS JOIST':         { hdr:'203864', txt:'FFFFFF', row:'C5D9F1', dot:'#1d4ed8' },
  'ACESSÓRIO PADRÃO':         { hdr:'156082', txt:'FFFFFF', row:'C6EFCE', dot:'#0ea5e9' },
  'BARRAS':                   { hdr:'4472C4', txt:'FFFFFF', row:'DDEBF7', dot:'#6366f1' },
  'CENTRO DE SERVIÇO':        { hdr:'00B0F0', txt:'1F3864', row:'D6F4FF', dot:'#06b6d4' },
  'PINTURA':                  { hdr:'C00000', txt:'FFFFFF', row:'FFD7D7', dot:'#ef4444' },
  'GALVÂNICA':                { hdr:'7F7F7F', txt:'FFFFFF', row:'EDEDED', dot:'#94a3b8' },
  'LAMINADOS':                { hdr:'70AD47', txt:'FFFFFF', row:'EBF7E2', dot:'#84cc16' },
  'ARMAÇÃO':                  { hdr:'404040', txt:'FFFFFF', row:'F2F2F2', dot:'#6b7280' },
};
const ROUTE_ORDER = Object.keys(ROUTE_CFG);

// Colunas de saída — apenas as que existem no arquivo original
const COLS_FIXED = ['PLANEJADOR','PACOTE','OBRA','NOME TRECHO','SUB TRECHO','POSICAO',
  'GRP LIC','MARCA','ESP','LARG','COMP','DESENHO','NOME PERFIL',
  'ORDEM','COD ITEM','QTDE OF','COD ITEM DEMANDA',
  'DESC TECNICA DEMANDA','COD ALMOX DEM','QTDE DEM UNIT','QTDE DEMANDA','UM','ROTA'];

const COL_W = {
  'PLANEJADOR':30,'PACOTE':8,'OBRA':8,'NOME TRECHO':20,'SUB TRECHO':12,
  'POSICAO':10,'GRP LIC':24,'MARCA':16,'ESP':7,'LARG':7,'COMP':10,
  'DESENHO':12,'NOME PERFIL':20,'ORDEM':12,'COD ITEM':14,'QTDE OF':8,
  'COD ITEM DEMANDA':18,'DESC TECNICA DEMANDA':38,'COD ALMOX DEM':14,
  'QTDE DEM UNIT':14,'QTDE DEMANDA':14,'UM':6,'ROTA':25
};

const OBS_MAP = {
  'PREPARAÇÃO':               'Chapa bruta/cortada ASTM · sem intermediários',
  'PREPARAÇÃO (DOBRA)':       'Perfil U/C dentro do parâmetro mas comp < 800mm',
  'PERFILADEIRA U/C':         'Alma ≥100, aba ≤106 (U) · alma >100, aba1 >50, aba2 <30 (C) · comp ≥800mm',
  'PERFILADEIRA L':           'Abas iguais · esp ≤ 3,0mm · sem intermediários',
  'PERFILADEIRA Z':           'GRP LIC = PERFIL Z · sem intermediários · sem tinta',
  'PERFILADEIRA BANZO JOIST': 'GRP LIC = BANZO JOIST / BANZO PROJOIST · sem intermediários',
  'PERFILADEIRA U JOIST':     'GRP LIC = PERFIL U JOIST / PROJOIST · sem intermediários',
  'ACESSÓRIOS JOIST':         'GRP LIC = ACESSORIOS JOIST/PRENSA/PROJOIST · sem inter. · sem tinta',
  'ACESSÓRIO PADRÃO':         'SE2-4 · SEZ1-4 · SD1 · TIRA BLANK estoque',
  'BARRAS':                   'Barra redonda ASTM A36 / SAE 1020',
  'CENTRO DE SERVIÇO':        'Arremate · Calha · Telhas TP/Zipada · Bobina Zipada',
  'PINTURA':                  'Tinta (qualquer tipo) · Catalisador/Diluente Epoxi/PU — PRIORIDADE MÁXIMA',
  'GALVÂNICA':                'Qualquer demanda com ZINCO',
  'LAMINADOS':                'Perfil W/HP/I/U ASTM · Cantoneira · Tubo red./quad. · sem intermediários',
  'ARMAÇÃO':                  'Todos os itens não classificados nas rotas acima',
};

const BARRAS = new Set([
  'BARRA REDONDA ASTM A36 12,70MM','BARRA REDONDA ASTM A36 16,00MM',
  'BARRA REDONDA ASTM A36 19,00MM','BARRA REDONDA ASTM A36 22,20MM',
  'BARRA REDONDA ASTM A36 25,40MM','BARRA REDONDA ASTM A36 31,75MM',
  'BARRA REDONDA ASTM A36 38,10MM','BARRA REDONDA ASTM A36 44,45MM',
  'BARRA REDONDA ASTM A36 9,50MM', 'BARRA REDONDA SAE 1020 38,10MM'
].map(s=>s.toUpperCase()));

const ACESS_PADRAO = new Set([
  'SE2 ESTOQUE','SE3 ESTOQUE','SE4 ESTOQUE','SEZ1 ESTOQUE','SEZ2 ESTOQUE',
  'SEZ3 ESTOQUE','SEZ4 ESTOQUE','SD1 ESTOQUE',
  'TIRA BLANK 25 X 3000 A572 PC','TIRA BLANK 25 X 3000 ZAR 400 PC'
].map(s=>s.toUpperCase()));

const CS_PERFIS = new Set(['ARREMATE','CALHA','TELHA TP100','TELHA TP17','TELHA TP35','TELHA TP40','TELHA ZIPADA']);

function parseU(n){ const m=String(n).match(/^U(\d+\.?\d*)X(\d+\.?\d*)X[\d.]+/i); return m?[+m[1],+m[2]]:null; }
function parseC(n){ const m=String(n).match(/^C(\d+\.?\d*)X(\d+\.?\d*)X(\d+\.?\d*)/i); return m?[+m[1],+m[2],+m[3]]:null; }
function parseL(n){ const m=String(n).match(/^L(\d+\.?\d*)X(\d+\.?\d*)X([\d.]+)/i); return m?[+m[1],+m[2],+m[3]]:null; }
function parseComp(v){ if(v==null||v==='')return null; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; }
function isInter(d){ return /INTERMEDIARI/i.test(String(d)); }
function isTinta(d){ return /\bTINTA\b/i.test(String(d)); }
function isCatDil(d){ return /\b(CATALISADOR|DILUENTE)\b.*\b(EPOXI|PU)\b/i.test(String(d)); }

function fixQty(val, um){
  if(val==null||val===''||String(val).toUpperCase()==='NONE') return null;
  const umUp = String(um||'').trim().toUpperCase();
  if(typeof val === 'string'){
    let raw = val.trim();
    if(raw===''||raw==='None') return null;
    if(raw.startsWith(',')) raw='0'+raw;
    const n = parseFloat(raw.replace(',','.'));
    return isNaN(n)?val:Math.round(n*1e6)/1e6;
  }
  if(typeof val === 'number'){
    if(umUp==='KG' && Number.isInteger(val) && Math.abs(val)>=1)
      return Math.round((val/1000)*1e6)/1e6;
    return val;
  }
  return val;
}

function classify(row){
  const desc = String(row['DESC TECNICA DEMANDA']||'').trim();
  const du   = desc.toUpperCase();
  const grp  = String(row['GRP LIC']||'').trim().toUpperCase();
  const nome = String(row['NOME PERFIL']||'').trim();
  const nu   = nome.toUpperCase();
  const comp = parseComp(row['COMP']);
  const itr  = isInter(desc);

  if(isTinta(desc)||isCatDil(desc))           return 'PINTURA';
  if(/\bZINCO\b/i.test(desc))                 return 'GALVÂNICA';
  if(/^CHAPA\s+(ASTM|CORTADA)/i.test(du))     return 'PREPARAÇÃO';
  if(BARRAS.has(du))                           return 'BARRAS';
  if(ACESS_PADRAO.has(du))                     return 'ACESSÓRIO PADRÃO';
  if(grp.includes('PERFIL Z')&&!itr)           return 'PERFILADEIRA Z';
  if((grp.includes('BANZO JOIST')||grp.includes('BANZO PROJOIST'))&&!itr) return 'PERFILADEIRA BANZO JOIST';
  if((grp.includes('PERFIL U JOIST')||grp.includes('PERFIL U PROJOIST'))&&!itr) return 'PERFILADEIRA U JOIST';
  if(['ACESSORIOS JOIST','ACESSORIOS JOIST PRENSA','ACESSORIOS PROJOIST PRENSA'].some(x=>grp.includes(x))&&!itr) return 'ACESSÓRIOS JOIST';
  if(CS_PERFIS.has(nu)||grp.includes('TELHAS')||grp.includes('BOBINA ZIPADA')) return 'CENTRO DE SERVIÇO';
  if(!itr){
    if(/^PERFIL\s+(W|HP|I|U)\s+ASTM/i.test(du))          return 'LAMINADOS';
    if(/^CANTONEIRA\s+(ASTM|PARA\s+LANTERNIM)/i.test(du)) return 'LAMINADOS';
    if(/^TUBO\s+(REDONDO|QUADRADO)/i.test(du))            return 'LAMINADOS';
    if(grp.includes('VIGA/PILAR LAMINADO')||grp.includes('PERFIL L JOIST')||grp.includes('PERFIL L PROJOIST')) return 'LAMINADOS';
  }
  if(!itr && /^L\d/i.test(nu)){
    const pl=parseL(nome); if(pl&&pl[0]===pl[1]&&pl[2]<=3.0) return 'PERFILADEIRA L';
  }
  if(!itr){
    if(/^U\d/i.test(nu)){
      const pu=parseU(nome);
      if(pu){
        const[alma,aba]=pu;
        if(/^U150X81X3\.00/i.test(nome)&&comp!=null&&comp<500) return 'PREPARAÇÃO';
        if(alma>=100&&aba<=106){
          if(comp!=null&&comp>=800) return 'PERFILADEIRA U/C';
          if(comp!=null)            return 'PREPARAÇÃO (DOBRA)';
        }
      }
    }
    if(/^C\d/i.test(nu)){
      const pc=parseC(nome);
      if(pc){
        const[alma,aba1,aba2]=pc;
        if(alma>100&&aba1>50&&aba2<30){
          if(comp!=null&&comp>=800) return 'PERFILADEIRA U/C';
          if(comp!=null)            return 'PREPARAÇÃO (DOBRA)';
        }
      }
    }
  }
  return 'ARMAÇÃO';
}

function hexARGB(h){ return 'FF'+h.replace('#','').toUpperCase(); }

function buildXlsx(rows, pacoteNum){
  const wb = XLSX.utils.book_new();
  const groups={};
  for(const r of ROUTE_ORDER) groups[r]=[];
  for(const row of rows) groups[row.ROTA].push(row);
  const total=rows.length;

  // RESUMO
  const resumoData=[
    [`ROTEIRIZAÇÃO v3 — PACOTE ${pacoteNum}`,'','',''],
    ['SETOR / ROTA','QTD ORDENS','% DO TOTAL','CRITÉRIOS'],
    ...ROUTE_ORDER.map(r=>[r,groups[r].length,(groups[r].length/total*100).toFixed(1)+'%',OBS_MAP[r]||'']),
    ['TOTAL',total,'100,0%','']
  ];
  const wsR=XLSX.utils.aoa_to_sheet(resumoData);
  wsR['!cols']=[{wch:30},{wch:14},{wch:12},{wch:58}];
  XLSX.utils.book_append_sheet(wb,wsR,'RESUMO');

  // DATA SHEETS — usa apenas colunas que existem no arquivo
  for(const rota of ROUTE_ORDER){
    const sub=groups[rota];
    if(!sub.length) continue;
    // Build cols list from what actually exists in data
    const colsOut = COLS_FIXED.filter(c => c==='ROTA' || sub[0].hasOwnProperty(c));
    const dataRows=sub.map(row=>colsOut.map(c=>{
      const v=row[c]; return(v==null||v==='None'||v==='nan')?'':v;
    }));
    const ws=XLSX.utils.aoa_to_sheet([colsOut,...dataRows]);
    ws['!cols']=colsOut.map(c=>({wch:COL_W[c]||12}));
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:dataRows.length,c:colsOut.length-1}})};
    const cfg=ROUTE_CFG[rota]||{};
    for(let c=0;c<colsOut.length;c++){
      const addr=XLSX.utils.encode_cell({r:0,c});
      if(!ws[addr]) continue;
      ws[addr].s={
        font:{bold:true,color:{rgb:hexARGB(cfg.txt||'000000')}},
        fill:{patternType:'solid',fgColor:{rgb:hexARGB(cfg.hdr||'CCCCCC')}},
        alignment:{horizontal:'center',vertical:'center',wrapText:true}
      };
    }
    let sname=rota.substring(0,31).replace(/[\/\\?*\[\]:]/g,'_');
    XLSX.utils.book_append_sheet(wb,ws,sname);
  }
  return wb;
}

function setProgress(pct,label){
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-label').textContent=label;
}

function showError(msg){
  const el=document.getElementById('error-msg');
  el.textContent='⚠ '+msg; el.style.display='block';
}

let resultWb=null, resultFilename='Roteirizacao.xlsx';

async function processFile(file){
  { const l=document.getElementById('arq-nome'); if(l) l.textContent=file.name; }
  document.getElementById('error-msg').style.display='none';
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('summary-wrap').style.display='none';
  document.getElementById('btn-download').style.display='none';
  document.getElementById('btn-reset').style.display='none';
  setProgress(5,'Lendo arquivo...');

  try{
    const buf=await file.arrayBuffer();
    setProgress(20,'Parseando planilha...');

    const wb=XLSX.read(buf,{type:'array',cellDates:false,raw:true});
    const wsName=wb.SheetNames[0];
    const ws=wb.Sheets[wsName];

    // ── Leitura robusta: percorre linhas até encontrar a linha de cabeçalho ──
    // O cabeçalho é a linha que contém "DESC TECNICA DEMANDA"
    const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});

    let headerIdx=-1;
    for(let i=0;i<Math.min(allRows.length,10);i++){
      const row=allRows[i];
      if(row && row.some(v=>String(v||'').trim().toUpperCase()==='DESC TECNICA DEMANDA')){
        headerIdx=i; break;
      }
    }

    if(headerIdx===-1){
      showError('Não foi possível encontrar a linha de cabeçalho. Certifique-se que a coluna "DESC TECNICA DEMANDA" existe na planilha.');
      return;
    }

    setProgress(35,'Mapeando colunas...');

    // Normaliza headers: remove espaços extras, converte para maiúsculo para comparação
    const rawHeaders=allRows[headerIdx].map(h=>h!=null?String(h).trim():'');

    // Monta mapa coluna → índice (case-insensitive, trim)
    const colIndex={};
    rawHeaders.forEach((h,i)=>{ if(h) colIndex[h.toUpperCase()]=i; });

    // Verifica colunas mínimas necessárias
    const required=['DESC TECNICA DEMANDA','GRP LIC','NOME PERFIL','COMP','QTDE DEMANDA','QTDE DEM UNIT','UM','PACOTE'];
    for(const r of required){
      if(colIndex[r.toUpperCase()]===undefined){
        showError(`Coluna obrigatória não encontrada: "${r}". Colunas disponíveis: ${rawHeaders.filter(h=>h).join(', ')}`);
        return;
      }
    }

    // Função para obter valor de uma coluna por nome (case-insensitive)
    function getCol(rawRow, colName){
      const idx=colIndex[colName.toUpperCase()];
      return idx!==undefined?rawRow[idx]:null;
    }

    const dataRows=allRows.slice(headerIdx+1).filter(r=>r&&r.some(v=>v!=null&&v!==''));

    setProgress(50,'Classificando ordens...');

    const rows=[];
    for(const raw of dataRows){
      // Constrói objeto com TODOS os headers originais
      const row={};
      rawHeaders.forEach((h,i)=>{ if(h) row[h]=raw[i]!=null?raw[i]:null; });
      // Fixa quantities
      row['QTDE DEMANDA'] =fixQty(getCol(raw,'QTDE DEMANDA'), getCol(raw,'UM'));
      row['QTDE DEM UNIT']=fixQty(getCol(raw,'QTDE DEM UNIT'),getCol(raw,'UM'));
      row['ROTA']=classify(row);
      rows.push(row);
    }

    setProgress(75,'Gerando Excel...');

    const pacoteNum=rows[0]?.['PACOTE']||'?';
    resultFilename=`Roteirizacao_PCT_${pacoteNum}.xlsx`;
    document.getElementById('download-filename').textContent=resultFilename;
    document.getElementById('pacote-badge').textContent=`PACOTE ${pacoteNum}`;
    resultWb=buildXlsx(rows,pacoteNum);

    setProgress(95,'Montando resumo...');

    const counts={};
    for(const r of ROUTE_ORDER) counts[r]=0;
    for(const row of rows) counts[row.ROTA]=(counts[row.ROTA]||0)+1;
    const total=rows.length;

    const tbody=document.getElementById('summary-body');
    tbody.innerHTML='';
    for(const rota of ROUTE_ORDER){
      const cnt=counts[rota]; if(!cnt) continue;
      const cfg=ROUTE_CFG[rota];
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><div class="rota-cell"><span class="dot" style="background:${cfg.dot}"></span>${rota}</div></td><td class="count-cell">${cnt.toLocaleString('pt-BR')}</td><td class="pct-cell">${(cnt/total*100).toFixed(1)}%</td>`;
      tbody.appendChild(tr);
    }
    const trT=document.createElement('tr');
    trT.className='total-row';
    trT.innerHTML=`<td>TOTAL</td><td class="count-cell">${total.toLocaleString('pt-BR')}</td><td class="pct-cell">100%</td>`;
    tbody.appendChild(trT);

    setProgress(100,'Concluído ✓');
    setTimeout(()=>{
      document.getElementById('progress-wrap').style.display='none';
      document.getElementById('summary-wrap').style.display='block';
      document.getElementById('btn-download').style.display='block';
      document.getElementById('btn-reset').style.display='block';
    },400);

  }catch(e){
    showError('Erro ao processar: '+e.message);
    console.error(e);
  }
}

document.getElementById('btn-download').addEventListener('click',()=>{
  if(!resultWb) return;
  XLSX.writeFile(resultWb,resultFilename,{bookType:'xlsx',type:'binary',cellStyles:true});
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  document.getElementById('summary-wrap').style.display='none';
  document.getElementById('btn-download').style.display='none';
  document.getElementById('btn-reset').style.display='none';
  document.getElementById('file-input').value='';
  resultWb=null;
  { const l=document.getElementById('arq-nome'); if(l) l.textContent='Nenhum arquivo escolhido'; }
});

document.getElementById('file-input').addEventListener('change',e=>{
  if(e.target.files[0]) processFile(e.target.files[0]);
});

const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('drag-over');
  const f=e.dataTransfer.files[0]; if(f) processFile(f);
});

document.getElementById('btn-limpar').addEventListener('click',()=>{
  ['progress-wrap','summary-wrap','error-msg','btn-download','btn-reset'].forEach(i=>{document.getElementById(i).style.display='none';});
  document.getElementById('file-input').value='';
  resultWb=null;
  const l=document.getElementById('arq-nome'); if(l) l.textContent='Nenhum arquivo escolhido';
});
<\/script>
<script>
/* ===== TEMA CINZA – troca o branco das telas por cinza claro ===== */
(function () {
  var CORES = { pagina: "#d9dee5", quadro: "#e8ebef", dentro: "#eef0f3", campo: "#f2f4f6", borda: "#c9d0d9" };
  function quaseBranco(cor, minimo) {
    minimo = minimo || 244;
    var m = cor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if (!m) return false;
    if (m[4] !== undefined && parseFloat(m[4]) < 0.9) return false;
    var r = +m[1], g = +m[2], b = +m[3];
    return Math.min(r, g, b) >= minimo && Math.max(r, g, b) - Math.min(r, g, b) <= 20;
  }
  function aplicar(raiz) {
    document.body.style.setProperty("background-color", CORES.pagina, "important");
    document.documentElement.style.setProperty("background-color", CORES.pagina, "important");
    var todos = (raiz || document.body).querySelectorAll("*");
    for (var i = 0; i < todos.length; i++) {
      var el = todos[i];
      if (el.dataset.temaCinza) continue;
      var cs = getComputedStyle(el);
      if (!quaseBranco(cs.backgroundColor)) continue;
      var tag = el.tagName, cor;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") {
        cor = CORES.campo;
      } else {
        var pai = el.parentElement, dentroDeQuadro = false;
        while (pai && pai !== document.body) {
          if (pai.dataset.temaCinza === "quadro") { dentroDeQuadro = true; break; }
          pai = pai.parentElement;
        }
        cor = dentroDeQuadro ? CORES.dentro : CORES.quadro;
        el.dataset.temaCinza = "quadro";
      }
      el.style.setProperty("background-color", cor, "important");
      if (!el.dataset.temaCinza) el.dataset.temaCinza = "campo";
      if (parseFloat(cs.borderTopWidth) > 0 && quaseBranco(cs.borderTopColor, 215)) {
        el.style.setProperty("border-color", CORES.borda, "important");
      }
    }
  }
  function iniciar() {
    aplicar();
    var espera;
    new MutationObserver(function () { clearTimeout(espera); espera = setTimeout(aplicar, 60); })
      .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();
<\/script>
