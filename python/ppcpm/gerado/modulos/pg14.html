<script type="module">
/* ==========================================================================
   PPCPM — VISUALIZADOR 3D (Three.js r160, geometria gerada por código)
   Lê o window.MODELO (montado a partir do PDF pela aba Engenharia) ou abre
   o catálogo do PERFIL Z (Z170 | Z230 | Z290 | Z360).
   Mouse: esquerdo = mover a peça · direito = girar · rolagem = zoom.
   ========================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const MODELO = window.MODELO || { catalogo: true };

/* ---------------- catálogo Perfil Z (medidas de exibição; confira com o setor técnico) ---------------- */
const CAT_Z = { Z170: { h: 170, d1: 60, d2: 20 }, Z230: { h: 230, d1: 75, d2: 20 }, Z290: { h: 290, d1: 90, d2: 25 }, Z360: { h: 360, d1: 100, d2: 25 } };
const ESPESSURAS = [1.55, 1.70, 1.95, 2.30, 2.70];

/* ---------------- textura de aço escovado (canvas, sem imagem externa) ---------------- */
function texturaEscovada(tipo) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = tipo === 'galv' ? '#c9ccd0' : '#a9adb3'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 2600; i++) {                                     // riscos finos na direção do comprimento
    const y = Math.random() * c.height, v = 120 + Math.random() * 120, a = 0.08 + Math.random() * 0.22;
    g.strokeStyle = `rgba(${v},${v},${v + 4},${a})`; g.lineWidth = Math.random() < 0.85 ? 0.6 : 1.4;
    const x = Math.random() * c.width, w = 80 + Math.random() * 600;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y + (Math.random() - 0.5) * 0.8); g.stroke();
  }
  if (tipo === 'galv') {                                               // manchas leves da galvanização a fogo
    for (let i = 0; i < 90; i++) { const r = 10 + Math.random() * 40; g.fillStyle = `rgba(${Math.random() < .5 ? 255 : 120},${Math.random() < .5 ? 255 : 125},${Math.random() < .5 ? 255 : 130},0.07)`; g.beginPath(); g.arc(Math.random() * c.width, Math.random() * c.height, r, 0, 7); g.fill(); }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;

/* ---------------- seções transversais ---------------- */
// chapa dobrada: linha de centro (com cantos arredondados) engrossada para a espessura t
function chapaDobrada(pts, t, raio) {
  const P = pts.map((p) => new THREE.Vector2(p[0], p[1])), linha = [P[0]];
  for (let i = 1; i < P.length - 1; i++) {
    const a = P[i - 1], b = P[i], c = P[i + 1];
    const d1 = b.clone().sub(a), d2 = c.clone().sub(b), k = Math.min(raio, d1.length() / 2.2, d2.length() / 2.2);
    const p1 = b.clone().sub(d1.normalize().multiplyScalar(k)), p2 = b.clone().add(d2.normalize().multiplyScalar(k));
    for (let s = 0; s <= 6; s++) { const u = s / 6; linha.push(new THREE.Vector2((1 - u) * (1 - u) * p1.x + 2 * (1 - u) * u * b.x + u * u * p2.x, (1 - u) * (1 - u) * p1.y + 2 * (1 - u) * u * b.y + u * u * p2.y)); }
  }
  linha.push(P[P.length - 1]);
  const esq = [], dir = [];
  for (let i = 0; i < linha.length; i++) {
    const ant = linha[Math.max(0, i - 1)], prox = linha[Math.min(linha.length - 1, i + 1)];
    const d = prox.clone().sub(ant).normalize(), n = new THREE.Vector2(-d.y, d.x).multiplyScalar(t / 2);
    esq.push(linha[i].clone().add(n)); dir.push(linha[i].clone().sub(n));
  }
  return new THREE.Shape(esq.concat(dir.reverse()));
}
function retArredondado(w, h, r, cx = 0, cy = 0, furo = false) {
  const s = furo ? new THREE.Path() : new THREE.Shape(), x = cx - w / 2, y = cy - h / 2; r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);

  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
const R45 = Math.SQRT1_2;
// devolve { pecas: [Shape...], alma: {x, y0, y1} | null, linhas: [[x,y]...] para o desenho 2D }
function secao(P) {

  if (P.tipo === 'CX') { const s = retArredondado(b, h, t * 2); s.holes.push(retArredondado(b - 2 * t, h - 2 * t, t, 0, 0, true)); return { pecas: [s], contorno: [[-b / 2, -h / 2], [b / 2, -h / 2], [b / 2, h / 2], [-b / 2, h / 2], [-b / 2, -h / 2]] }; }

/* ---------------- componente reutilizável ---------------- */
function criarVisualizador3D(container, parametros) {

  const cena = new THREE.Scene();

  const luz = new THREE.DirectionalLight(0xffffff, 1.1); luz.castShadow = true; luz.shadow.mapSize.set(2048, 2048); cena.add(luz, luz.target);

  controles.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  controles.autoRotate = true; controles.autoRotateSpeed = 1.5;
  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

  // cursor "grab" / "grabbing"
  renderer.domElement.addEventListener('pointerdown', () => container.classList.add('arrastando'));
  window.addEventListener('pointerup', () => container.classList.remove('arrastando'));
  // giro automático para quando o usuário mexe e volta depois de 5 s parado
  let timerGiro = null;

  controles.addEventListener('end', () => { clearTimeout(timerGiro); timerGiro = setTimeout(() => { controles.autoRotate = true; }, 5000); });

  let grupo = null, sombra = null, materiais = {}, inicio = null, raio = 1000, P = parametros;
  const textura = { natural: texturaEscovada('natural'), galv: texturaEscovada('galv') };

  function material(acab, cor) {
    if (acab === 'pintura') return new THREE.MeshStandardMaterial({ color: cor || '#2f5d8a', metalness: 0.2, roughness: 0.5 });

  function descartar() {

    cena.remove(grupo); grupo = null;

  // escala da textura: riscos acompanham o comprimento (UV do extrude = mm)
  function ajustarUV(geo, aoLongo = true) {   // aoLongo: riscos acompanham o comprimento da peça
    const uv = geo.attributes.uv;

  function extrudar(shape, comp, mat, nome) {

    ajustarUV(geo);
    const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; m.userData.nome = nome; return m;
  }
  // chapa plana (com furos) no plano (u ao longo da viga, v altura), espessura no eixo X
  function chapa(larguraU, alturaV, esp, furos, mat, nome) {
    const s = retArredondado(larguraU, alturaV, Math.min(3, esp / 2));

    const geo = new THREE.ExtrudeGeometry(s, { depth: esp, bevelEnabled: false, curveSegments: 24 });

  function montar(par) {

    grupo = new THREE.Group(); grupo.userData.pecas = [];
    const perfil = par.perfil, sec = secao(perfil), L = par.comprimento, segs = par.segmentos && par.segmentos.length ? par.segmentos : [L];

    // perfil principal, um pedaço por trecho (as emendas aparecem como uma linha fina)
    let z = 0;
    segs.forEach((comp, i) => {
      const g = new THREE.Group();
      sec.pecas.forEach((s) => g.add(extrudar(s, comp - (segs.length > 1 ? 1.5 : 0), mat, par.nomePrincipal || 'Perfil principal')));
      if (sec.alma) {   // alma (Z / U) como chapa própria: assim os furos atravessam de verdade
        const altA = sec.alma.y1 - sec.alma.y0, furos = [];
        if (par.comFuro) for (let u = 250; u < comp; u += 500) furos.push([u - comp / 2, 0, par.furoDiam || 14]);
        const a = chapa(comp, altA, sec.alma.t, furos, mat, par.nomePrincipal || 'Perfil principal');

      }
      g.position.z = z; z += comp; grupo.add(g);
      g.children.forEach((m) => grupo.userData.pecas.push(m));
    });

    // chapas lidas do desenho: tampas, abas de ligação com furos, enrijecedores
    (par.placas || []).forEach((pl) => {
      const nome = `${pl.marca} · ${pl.descricao} (CH ${pl.esp} × ${pl.larg} × ${pl.comp})`;
      if (pl.papel === 'tampa') {
        [[-pl.esp, 'i'], [L, 'f']].slice(0, Math.max(1, Math.min(2, pl.qtd))).forEach(([zz]) => {
          const geo = new THREE.ExtrudeGeometry(retArredondado(pl.lar, pl.alt, 1), { depth: pl.esp, bevelEnabled: false }); ajustarUV(geo);
          const m = new THREE.Mesh(geo, mat); m.position.z = zz; m.castShadow = m.receiveShadow = true; m.userData.nome = nome; m.userData.marca = pl.marca; grupo.add(m); grupo.userData.pecas.push(m);
        });
      } else if (pl.papel === 'aba') {
        const temTampa = (par.placas || []).some((x) => x.papel === 'tampa'), e0 = temTampa ? (par.placas.find((x) => x.papel === 'tampa').esp) : 0;
        const n = par.furos ? par.furos.n : 0, dF = par.furos ? par.furos.d : 18, furos = [];
        for (let k = 0; k < n; k++) furos.push([0, (n === 1 ? 0 : -pl.alt * 0.3 + (pl.alt * 0.6) * k / (n - 1)), dF]);
        [['i'], ['f']].slice(0, Math.max(1, Math.min(2, pl.qtd))).forEach(([lado]) => {
          const m = chapa(pl.proj, pl.alt, pl.esp, furos, mat, nome);
          m.position.z = lado === 'i' ? -e0 - pl.proj / 2 : L + e0 + pl.proj / 2; m.userData.marca = pl.marca; grupo.add(m); grupo.userData.pecas.push(m);
        });
      } else {
        const n = Math.max(1, pl.qtd);
        for (let k = 0; k < n; k++) {
          const geo = new THREE.ExtrudeGeometry(retArredondado(pl.lar, pl.alt, 1), { depth: pl.esp, bevelEnabled: false }); ajustarUV(geo);
          const m = new THREE.Mesh(geo, mat); m.position.z = L * (k + 1) / (n + 1) - pl.esp / 2; m.castShadow = m.receiveShadow = true; m.userData.nome = nome; m.userData.marca = pl.marca; grupo.add(m); grupo.userData.pecas.push(m);
        }
      }
    });

    grupo.rotation.y = Math.PI / 2;                    // comprimento ao longo do eixo X
    cena.add(grupo);
    // centraliza na origem (o giro fica em torno do meio da peça)
    const caixa = new THREE.Box3().setFromObject(grupo), centro = caixa.getCenter(new THREE.Vector3());
    grupo.position.sub(centro);
    const cx = new THREE.Box3().setFromObject(grupo), tam = cx.getSize(new THREE.Vector3());
    raio = tam.length() / 2;

    // sombra de contato bem suave embaixo da peça
    sombra = new THREE.Mesh(new THREE.PlaneGeometry(tam.x * 1.6 + 400, tam.z * 3 + 400), new THREE.ShadowMaterial({ opacity: 0.15 }));
    sombra.rotation.x = -Math.PI / 2; sombra.position.y = cx.min.y - 2; sombra.receiveShadow = true; cena.add(sombra);
    luz.position.set(tam.x * 0.3, raio * 2 + 500, raio * 0.8 + 300); luz.target.position.set(0, 0, 0);
    const sc = luz.shadow.camera; sc.left = -tam.x; sc.right = tam.x; sc.top = tam.z * 2 + 300; sc.bottom = -tam.z * 2 - 300; sc.near = 1; sc.far = raio * 6 + 3000; sc.updateProjectionMatrix();

    controles.minDistance = Math.max(40, Math.max(tam.y, tam.z) * 0.6);

  function vistaInicial(tam) {

    const cx = new THREE.Box3().setFromObject(grupo), tam = cx.getSize(new THREE.Vector3());
    const alvo = new THREE.Vector3(lado < 0 ? cx.min.x + Math.min(tam.x * 0.15, 500) : cx.max.x - Math.min(tam.x * 0.15, 500), 0, 0);
    const d = Math.max(tam.y, tam.z) * 3.2 + 200;
    irPara(alvo.clone().add(new THREE.Vector3(lado * d * 0.85, d * 0.45, d * 0.7)), alvo);   // olhando a ponta por fora (tampa e aba à vista)
  }

  // destaque ao passar o mouse
  const raycaster = new THREE.Raycaster(), ponteiro = new THREE.Vector2(), rotulo = $('#rotulo');
  let destacado = [];
  function destacar(lista) {
    destacado.forEach((m) => { m.material = materiais.principal; });
    destacado = lista || [];
    if (destacado.length) { if (!materiais.luz) { materiais.luz = materiais.principal.clone(); materiais.luz.emissive = new THREE.Color('#1d6fd1'); materiais.luz.emissiveIntensity = 0.35; } destacado.forEach((m) => { m.material = materiais.luz; }); }
  }
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (!grupo || e.buttons) return;
    const r = renderer.domElement.getBoundingClientRect();
    ponteiro.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ponteiro, camera);

      rotulo.textContent = nome; rotulo.style.display = 'block'; rotulo.style.left = (e.clientX - r.left) + 'px'; rotulo.style.top = (e.clientY - r.top) + 'px';
      document.dispatchEvent(new CustomEvent('ppcpm-peca', { detail: marca || '' }));
    } else { destacar([]); rotulo.style.display = 'none'; document.dispatchEvent(new CustomEvent('ppcpm-peca', { detail: null })); }
  });

  // tamanho responsivo

    atualizar(novos, animar = true) { const antes = camera.position.clone(), alvo = controles.target.clone(); montar(novos); if (animar) { camera.position.copy(antes.multiplyScalar(0.92)); controles.target.copy(alvo); irPara(inicio.pos.clone(), inicio.alvo.clone(), 700); } },

    destacarMarca(marca) { if (!grupo) return; destacar(marca === null ? [] : grupo.userData.pecas.filter((m) => marca ? m.userData.marca === marca : !m.userData.marca)); },
    resetar, focarPonta, tamanho: () => r.tamanho
  };
}

/* ---------------- desenho técnico 2D da seção (SVG com cotas) ---------------- */
function desenho2D(perfil) {
  const sec = secao(perfil), pts = [];
  sec.pecas.forEach((s) => pts.push(s.getPoints(8)));
  const todos = pts.flat(), xs = todos.map((p) => p.x), ys = todos.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = maxX - minX, H = maxY - minY, m = Math.max(W, H) * 0.45, vb = [minX - m, -maxY - m * 0.6, W + 2 * m, H + m * 1.6];
  const esc = Math.max(W, H) / 200, fs = 17 * esc, sw = 1.5 * esc;
  const caminho = (arr) => 'M' + arr.map((p) => `${p.x.toFixed(2)},${(-p.y).toFixed(2)}`).join('L') + 'Z';
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}"><g fill="#dbe4f3" stroke="#0b5cad" stroke-width="${sw}">`;
  pts.forEach((arr) => { svg += `<path d="${caminho(arr)}"/>`; });
  sec.pecas.forEach((s) => s.holes.forEach((h) => { svg += `<path d="${caminho(h.getPoints(8))}" fill="#fff"/>`; }));
  if (sec.alma) svg += `<rect x="${-sec.alma.t / 2}" y="${-sec.alma.y1}" width="${sec.alma.t}" height="${sec.alma.y1 - sec.alma.y0}"/>`;
  svg += `</g><g stroke="#1a2233" stroke-width="${sw * 0.7}" fill="#1a2233" font-family="Arial" font-weight="700" font-size="${fs}">`;
  const cota = (x1, y1, x2, y2, txt, dx, dy) => { svg += `<line x1="${x1}" y1="${-y1}" x2="${x2}" y2="${-y2}"/><circle cx="${x1}" cy="${-y1}" r="${sw * 1.4}"/><circle cx="${x2}" cy="${-y2}" r="${sw * 1.4}"/><text x="${(x1 + x2) / 2 + dx}" y="${-(y1 + y2) / 2 + dy}" stroke="none" text-anchor="middle">${txt}</text>`; };
  const off = m * 0.35;
  cota(maxX + off, minY, maxX + off, maxY, perfil.tipo === 'Z' ? 'Z' : String(perfil.h), fs * 0.9, fs * 0.35);
  if (perfil.tipo === 'Z') {
    const t = perfil.t, b = perfil.b, d = perfil.d;
    cota(0, minY - off, b - t / 2, minY - off, 'D1', 0, fs * 1.2);
    const lx = b - t / 2, ly = -perfil.h / 2 + t / 2;
    cota(lx + off * 0.4, ly - off * 0.2, lx + d * R45 + off * 0.4, ly + d * R45 - off * 0.2, 'D2', fs * 1.1, fs * 0.2);
    svg += `<text x="${minX - off * 0.2}" y="${-maxY - off * 0.5}" stroke="none" text-anchor="middle">45°</text>`;
  } else {
    cota(minX, minY - off, maxX, minY - off, String(perfil.b || ''), 0, fs * 1.2);
  }
  svg += '</g></svg>';
  return svg;
}

/* ---------------- tela (ficha + 3D) ---------------- */

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ficha() {

<script>
/* =====================================================================
   PPCPM — LEITOR DE DESENHO (PDF) PARA 3D
   Recebe as linhas de texto do PDF (já em ordem de leitura) e devolve
   o "modelo" da peça: perfil principal, comprimento, emendas, chapas
   (tampas / abas de ligação / enrijecedores) e furos — tudo tirado da
   LISTA DE MATERIAIS, das seções (ex.: CX_300X200X3.00) e das cotas.
   ===================================================================== */
function interpretarDesenho(linhas, nomeArquivo) {
  'use strict';
  var texto = linhas.join('\n');
  function num(v) { return v == null ? NaN : parseFloat(String(v).replace(',', '.')); }

    arquivo: (/ARQUIVO:\s*(F\d{4}_\S+?_R\d+)/.exec(texto) || [])[1] || String(nomeArquivo || '').replace(/\.pdf$/i, '') || (/\b(F\d{4}_[\w\-]+?_R\d+)\b/.exec(texto) || [])[1] || '',
    objeto: campo(/OBJETO:\s*([^\n]+)/), obra: campo(/OF\/OBRA:\s*([^\n]+)/), trecho: campo(/TRECHO:\s*([^\n]+)/),
    cliente: campo(/CLIENTE:\s*([^\n]+)/), titulo: campo(/T[IÍ]TULO:\s*([^\n]+)/),

    cotas: [], conferencia: null, avisos: []

  /* ---------- 1) LISTA DE MATERIAIS ---------- */

  if (ini >= 0) {
    for (var i = ini + 1; i < linhas.length; i++) {
      var l = linhas[i].trim();
      if (/^TOTAL\b/i.test(l)) break;
      var m = /^(\S*\d\S*)\s+(\d+)\s+(.+)$/.exec(l);
      if (!m || /^(PE[ÇC]A|CONJ)\b/i.test(l)) continue;

      var d = it.descricao, ch = /^(CH|PL|CHAPA|BARRA CHATA|BC)\s+(\d+(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)\s+(\d+(?:[.,]\d+)?)\s*(\S*)/i.exec(d);

      if (ch) { it.tipo = 'chapa'; it.esp = num(ch[2]); it.larg = num(ch[3]); it.comp = num(ch[4]); it.material = ch[5] || ''; }
      else if (pf) {

    if (t === 'Z') return !isNaN(e) ? { tipo: 'Z', h: a, b: b, d: c, t: e } : (!isNaN(c) ? (c <= 6 ? { tipo: 'Z', h: a, b: b, d: 20, t: c } : { tipo: 'Z', h: a, b: b, d: c, t: 2 }) : { tipo: 'Z', h: a, b: b, d: 20, t: 2 });
    if (t === 'UE' || t === 'CE') return { tipo: 'UE', h: a, b: b, d: isNaN(c) ? 20 : c, t: isNaN(e) ? 2 : e };
    if (t === 'U' || t === 'C') return isNaN(e) && !isNaN(c) && c <= 6 ? { tipo: 'U', h: a, b: b, t: c } : { tipo: isNaN(c) ? 'U' : 'UE', h: a, b: b, d: c, t: isNaN(e) ? 2 : e };

    if (t === 'W' || t === 'I' || t === 'H') return { tipo: 'W', h: a, b: Math.round(a * 0.5), tf: Math.max(6, Math.round(a / 25)), tw: Math.max(5, Math.round(a / 40)) };
    if (t === 'CART') return { tipo: 'CART', h: a, b: b, d: 20, t: isNaN(c) ? 2 : c };
    return null;
  }
  var mSec = /\(\s*((?:CX|TB|TQ|TR|UE|CE|Z|U|C|L|W|I|H)\s*_?\s*\d{2,4}(?:[.,]\d+)?\s*X\s*\d{1,4}(?:[.,]\d+)?(?:\s*X\s*\d{1,4}(?:[.,]\d+)?){0,2})\s*\)/i.exec(texto);
  if (mSec) { M.perfil = perfilDe(RE_PERFIL.exec(mSec[1].replace(/\s+/g, ''))); M.perfil.origem = 'seção ' + mSec[1].replace(/\s+/g, ''); }

  /* ---------- 3) COMPRIMENTO E EMENDAS ---------- */
  var longas = M.itens.filter(function (it) { return it.tipo === 'chapa' && it.esp <= 6.35 && it.comp >= 1000; });

  else if (longas.length) {
    var vistos = [];
    longas.forEach(function (it) { if (vistos.indexOf(it.comp) < 0) vistos.push(it.comp); });

  linhas.forEach(function (l) { (l.match(/(?:^|\s)(\d{3,5})(?=\s|$)/g) || []).forEach(function (x) { var v = parseInt(x, 10); if (v >= 100 && M.cotas.indexOf(v) < 0) M.cotas.push(v); }); });
  if (!M.comprimento) {
    var grandes = M.cotas.filter(function (v) { return v >= 1000 && v <= 15000; }).sort(function (a, b) { return b - a; });
    M.comprimento = grandes[0] || 1500;
    M.segmentos = [M.comprimento];
    M.avisos.push(grandes.length ? 'Comprimento tirado da maior cota do desenho (' + grandes[0] + ' mm).' : 'Comprimento não encontrado: usei 1500 mm só para visualizar.');
  }
  if (!M.perfil) {
    M.perfil = { tipo: 'CHAPA', h: 200, b: 0, t: 3, origem: 'não identificado' };
    M.avisos.push('Não identifiquei o perfil principal: mostrei uma chapa simples. Os perfis lidos são CX, Z, U, UE, L, W e chapas (CH).');
  }

  /* ---------- 4) FUROS ("3*Ø18") ---------- */
  var mf = /(\d+)\s*[*xX×]\s*[ØΦ⌀]\s*(\d+(?:[.,]\d+)?)/.exec(texto);
  if (mf) M.furos = { n: parseInt(mf[1], 10), d: num(mf[2]) };

  /* ---------- 5) CHAPAS: tampas, abas de ligação, enrijecedores ---------- */
  var P = M.perfil, H = P.h || 200, B = P.b || 100;
  M.itens.filter(function (it) { return it.tipo === 'chapa' && !(it.esp <= 6.35 && it.comp >= 1000); }).forEach(function (it) {
    var a = Math.min(it.larg, it.comp), c = Math.max(it.larg, it.comp);

    else if (Math.abs(c - H) <= 25) { pl.papel = 'aba'; pl.alt = c; pl.proj = a; }                                  // aba de ligação na ponta
    else if (cabeDentro) { pl.papel = 'enrijecedor'; pl.alt = c; pl.lar = a; }
    else { pl.papel = 'aba'; pl.alt = Math.min(c, H); pl.proj = a; }

    M.placas.push(pl);
    it.papel3d = pl.descricao;

  longas.forEach(function (it) { it.papel3d = P.tipo === 'CX' ? 'Meia caixa (forma a viga)' : 'Chapa do perfil'; });
  if (itPerfil) itPerfil.papel3d = 'Perfil principal';

  /* ---------- 6) CONFERÊNCIA COM AS COTAS ---------- */
  var tampas = M.placas.filter(function (p) { return p.papel === 'tampa'; }), abas = M.placas.filter(function (p) { return p.papel === 'aba'; });

  M.conferencia = { corpo: M.comprimento, com_tampas: Math.round(total), com_abas: Math.round(totalAbas),
    ok_corpo: perto(M.comprimento), ok_tampas: tampas.length ? perto(total) : null, ok_abas: abas.length ? perto(totalAbas) : null };
  return M;
}

/* Junta os pedaços de texto do pdf.js em linhas (mesma altura = mesma linha) */
function linhasDoPdf(itens) {
  var grupos = [];
  itens.forEach(function (t) {
    if (!t.str || !t.str.trim()) return;
    var tr = t.transform, x = tr[4], y = tr[5], rot = Math.abs(tr[1]) > Math.abs(tr[0]);
    if (rot) return;   // textos girados (cotas verticais) entram depois, soltos
    var g = grupos.find(function (g) { return Math.abs(g.y - y) < 2.2; });
    if (!g) { g = { y: y, partes: [] }; grupos.push(g); }
    g.partes.push({ x: x, s: t.str });
  });
  grupos.sort(function (a, b) { return b.y - a.y; });
  var linhas = grupos.map(function (g) { return g.partes.sort(function (a, b) { return a.x - b.x; }).map(function (p) { return p.s; }).join(' ').replace(/\s+/g, ' ').trim(); });
  itens.forEach(function (t) { var tr = t.transform; if (t.str && t.str.trim() && Math.abs(tr[1]) > Math.abs(tr[0])) linhas.push(t.str.trim()); });
  return linhas;
}

  $('#b-pasta').onclick = function () { $('#in-pasta').click(); };

  $('#in-pasta').onchange = function () { adicionarArquivos(Array.from(this.files).filter(function (f) { return ehPdf(f.name) || ehZip(f.name); })); this.value = ''; };
  $('#drop').onclick = function () { $('#in-arq').click(); };
  var dz = $('#drop');
  dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
  dz.addEventListener('drop', async function (e) {
    e.preventDefault(); dz.classList.remove('over');
    var entradas = Array.from(e.dataTransfer.items || []).map(function (it) { return it.webkitGetAsEntry ? it.webkitGetAsEntry() : null; }).filter(Boolean);
    var arqs = [];
    async function andar(ent, rel) {
      if (ent.isFile) { await new Promise(function (ok) { ent.file(function (f) { f.caminho = rel + f.name; arqs.push(f); ok(); }, ok); }); return; }
      var leitor = ent.createReader(), lote;
      do { lote = await new Promise(function (ok) { leitor.readEntries(ok, function () { ok([]); }); }); for (var i = 0; i < lote.length; i++) await andar(lote[i], rel + ent.name + '/'); } while (lote.length);
    }
    if (entradas.length) { for (var i = 0; i < entradas.length; i++) await andar(entradas[i], ''); }
    else arqs = Array.from(e.dataTransfer.files || []);
    adicionarArquivos(arqs.filter(function (f) { return ehPdf(f.name) || ehZip(f.name); }));
  });
  $('#b-limpar').onclick = function () { ITENS = []; SEL.clear(); msg('#msg1', ''); msg('#msg2', ''); desenhar(); };

  /* busca na pasta da engenharia (só na versão Python deste PC) */
  var CAB = { 'X-PPCPM': '1' };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  fetch('/api/pc/locais', { headers: CAB, cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; $('#card-busca').hidden = false; $('#nb-lista').textContent = '3'; })
    .catch(function () { $('#grade').classList.add('uma'); });
  $('#raiz').value = lsGet('ppcpm:eng:raiz') || '';
  $('#termo').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#b-buscar').click(); });
  $('#b-buscar').onclick = async function () {
    var raiz = $('#raiz').value.trim().replace(/^"|"$/g, ''), termo = $('#termo').value.trim();
    if (!raiz) { msg('#msg2', 'Cole o caminho da pasta da engenharia.', true); $('#raiz').focus(); return; }
    if (!termo) { msg('#msg2', 'Digite a obra ou parte do nome do desenho.', true); $('#termo').focus(); return; }
    lsSet('ppcpm:eng:raiz', raiz);
    var b = this; b.disabled = true; msg('#msg2', 'Procurando "' + termo + '"… (pastas, subpastas e .zip)');
    try {
      var r = await fetch('/api/pc/buscar?caminho=' + encodeURIComponent(raiz) + '&termo=' + encodeURIComponent(termo) + '&filtro=.pdf', { headers: CAB, cache: 'no-store' });
      var j = await r.json(); if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
      var n = 0;
      j.itens.forEach(function (i) {
        if (i.pasta || !ehPdf(i.nome)) return;
        var origem = i.caminho.slice(0, i.caminho.length - i.nome.length).replace(/[\\\/]$/, '');
        if (adicionar(i.nome, origem, i.dentro_de ? 'zip' : 'rede', i.tamanho, function (c) { return function () {
          return fetch('/api/pc/arquivo?caminho=' + encodeURIComponent(c), { headers: CAB, cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('Não foi possível ler ' + c); return r.arrayBuffer(); }).then(function (b) { return new Uint8Array(b); });
        }; }(i.caminho), i.caminho)) n++;
      });
      msg('#msg2', n + ' desenho(s) encontrado(s)' + (j.incompleta ? ' (busca parcial: pasta muito grande — refine o termo)' : '') + '.');
      desenhar();
    } catch (e) { msg('#msg2', e.message || String(e), true); }
    b.disabled = false;
  };

  /* lista */
  function visiveis() {
    var q = $('#filtro').value.trim().toLowerCase();
    var l = ITENS.filter(function (i) { return !q || (i.nome + ' ' + i.obra + ' ' + i.origem).toLowerCase().indexOf(q) >= 0; });
    var c = ORDEM.col, s = ORDEM.asc ? 1 : -1;
    return l.sort(function (a, b) { return c === 'tamanho' ? s * ((a.tamanho || 0) - (b.tamanho || 0)) : s * String(a[c] || '').localeCompare(String(b[c] || ''), 'pt-BR', { numeric: true }); });
  }
  function desenhar() {
    var l = visiveis(), tab = $('#tab');
    $('#tot').textContent = ITENS.length + (ITENS.length === 1 ? ' PDF' : ' PDFs');
    if (!l.length) { tab.innerHTML = '<div class="vazio">' + (ITENS.length ? 'Nada com esse filtro.' : 'Nenhum desenho ainda. Adicione PDFs, pastas ou .zip.') + '</div>'; contar(); return; }
    var t = document.createElement('table'), cab = document.createElement('tr');
    [['', ''], ['nome', 'Desenho'], ['obra', 'Obra'], ['tipo', 'Onde está'], ['origem', 'Pasta / ZIP'], ['tamanho', 'Tamanho']].forEach(function (c) {
      var th = document.createElement('th'); th.textContent = c[1] + (ORDEM.col === c[0] ? (ORDEM.asc ? ' ▲' : ' ▼') : '');
      if (c[0]) th.onclick = function () { ORDEM = { col: c[0], asc: ORDEM.col === c[0] ? !ORDEM.asc : true }; desenhar(); };
      cab.appendChild(th);
    });
    var th0 = document.createElement('thead'); th0.appendChild(cab); t.appendChild(th0);
    var tb = document.createElement('tbody');
    l.forEach(function (i) {
      var tr = document.createElement('tr'); if (SEL.has(i.id)) tr.className = 'sel';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = SEL.has(i.id);
      cb.onchange = function () { if (cb.checked) SEL.add(i.id); else SEL.delete(i.id); tr.className = cb.checked ? 'sel' : ''; contar(); };
      var td = document.createElement('td'); td.appendChild(cb); tr.appendChild(td);
      var tn = document.createElement('td'); tn.className = 'nome'; tn.textContent = i.nome; tr.appendChild(tn);
      var to = document.createElement('td'); to.textContent = i.obra; tr.appendChild(to);
      var tt = document.createElement('td'); tt.innerHTML = '<span class="chip ' + i.tipo + '">' + ({ zip: 'Dentro de .zip', rede: 'Pasta da rede', pasta: 'Pasta' }[i.tipo] || i.tipo) + '</span>'; tr.appendChild(tt);
      var tg = document.createElement('td'); tg.className = 'nome'; tg.style.color = '#5b6474'; tg.style.fontWeight = '500'; tg.textContent = i.origem; tr.appendChild(tg);
      var tz = document.createElement('td'); tz.textContent = fmtTam(i.tamanho); tz.style.textAlign = 'right'; tr.appendChild(tz);
      tr.ondblclick = function () { abrir(i); };
      tr.onclick = function (e) { if (e.target === cb) return; cb.checked = !cb.checked; cb.onchange(); };
      tb.appendChild(tr);
    });
    t.appendChild(tb); tab.innerHTML = ''; tab.appendChild(t); contar();
  }
  function contar() { var n = ITENS.filter(function (i) { return SEL.has(i.id); }).length; $('#sel').textContent = 'Selecionados: ' + n; $('#b-imprimir').disabled = $('#b-baixar').disabled = !n; }
  $('#filtro').oninput = desenhar;
  $('#b-todos').onclick = function () { visiveis().forEach(function (i) { SEL.add(i.id); }); desenhar(); };
  $('#b-nenhum').onclick = function () { SEL.clear(); desenhar(); };

  /* abrir, imprimir, baixar */
  var urlAtual = null;
  function mostrar(bytes, titulo, imprimir) {
    if (urlAtual) URL.revokeObjectURL(urlAtual);
    urlAtual = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    $('#v-nome').textContent = titulo; $('#ver').classList.add('on');
    var f = $('#v-frame'); f.onload = imprimir ? function () { setTimeout(function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(urlAtual); } }, 400); } : null;
    f.src = urlAtual;
  }
  async function abrir(i) { try { mostrar(await i.obter(), i.nome, false); } catch (e) { alert('Não foi possível abrir o desenho.\n' + (e.message || e)); } }
  async function juntar() {
    var l = visiveis().filter(function (i) { return SEL.has(i.id); });
    if (l.length === 1) return { bytes: await l[0].obter(), nome: l[0].nome, n: 1 };
    if (typeof PDFLib === 'undefined') throw new Error('Componente de PDF não carregou (internet bloqueada?). Recarregue a página.');
    var doc = await PDFLib.PDFDocument.create(), pulados = [];
    for (var k = 0; k < l.length; k++) {
      try { var src = await PDFLib.PDFDocument.load(await l[k].obter(), { ignoreEncryption: true }); (await doc.copyPages(src, src.getPageIndices())).forEach(function (p) { doc.addPage(p); }); }
      catch (e) { pulados.push(l[k].nome); }
    }
    if (pulados.length) alert('Estes desenhos não puderam ser juntados (PDF protegido ou com defeito):\n' + pulados.join('\n'));
    return { bytes: await doc.save(), nome: l.length + ' desenhos', n: l.length };
  }
  async function acao(imprimir) {
    var b = imprimir ? $('#b-imprimir') : $('#b-baixar'); b.disabled = true; document.body.classList.add('ocupado');
    try {
      var r = await juntar();
      if (imprimir) mostrar(r.bytes, 'Imprimir — ' + r.nome, true);
      else {
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.bytes], { type: 'application/pdf' }));
        a.download = r.n === 1 ? r.nome : 'Desenhos_Engenharia_' + new Date().toISOString().slice(0, 10) + '.pdf'; a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      }
    } catch (e) { alert('Não foi possível preparar os desenhos.\n' + (e.message || e)); }
    b.disabled = false; document.body.classList.remove('ocupado'); contar();
  }
  $('#b-imprimir').onclick = function () { acao(true); };
  $('#b-baixar').onclick = function () { acao(false); };
  $('#v-imp').onclick = function () { var f = $('#v-frame'); try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(urlAtual); } };
  $('#v-fechar').onclick = function () { $('#ver').classList.remove('on'); $('#v-frame').src = 'about:blank'; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#ver').classList.contains('on')) $('#v-fechar').click(); });

  /* ---------------- VISUALIZAR 3D ---------------- */
  var PY = false;
  fetch('/api/pc/locais', { headers: CAB, cache: 'no-store' }).then(function (r) { PY = r.ok; }).catch(function () { });
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  async function textoDoPdf(bytes) {
    if (!window.pdfjsLib) throw new Error('Leitor de PDF não carregou (internet bloqueada?). Recarregue a página.');
    var doc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise, itens = [];
    for (var i = 1; i <= Math.min(doc.numPages, 3); i++) { var pg = await doc.getPage(i); itens = itens.concat((await pg.getTextContent()).items); }
    return linhasDoPdf(itens);
  }
  function escreverJanela(J, modelo) {
    var html = $('#tpl-3d').innerHTML;
    var dados = '<script>window.MODELO = ' + JSON.stringify(modelo).replace(/</g, '\\u003c') + ';<' + '/script>';
    html = '<!doctype html>' + html.replace('<script type="importmap">', dados + '<script type="importmap">');
    J.document.open(); J.document.write(html); J.document.close();
  }
  $('#b-3d').onclick = function () {
    var sel = visiveis().filter(function (i) { return SEL.has(i.id); });
    var w = Math.min(1500, screen.availWidth - 40), h = Math.min(900, screen.availHeight - 60);
    var J = window.open(PY ? '/pc/janela3d' : '', 'ppcpm_3d_' + Date.now(), 'popup=yes,width=' + w + ',height=' + h + ',left=' + Math.round((screen.availWidth - w) / 2) + ',top=' + Math.round((screen.availHeight - h) / 2));
    if (!J) { alert('O navegador bloqueou a janela do 3D.\nPermita pop-ups deste endereço e clique de novo.'); return; }
    var b = this; b.disabled = true;
    (async function () {
      try {
        var t0 = Date.now();
        while (PY && Date.now() - t0 < 6000) { try { if (J.location.pathname === '/pc/janela3d' && J.document.readyState === 'complete') break; } catch (e) { } await new Promise(function (r) { setTimeout(r, 40); }); }
        if (!sel.length) { escreverJanela(J, { catalogo: true }); return; }
        var it = sel[0], bytes = await it.obter(), M = interpretarDesenho(await textoDoPdf(bytes), it.nome);
        if (sel.length > 1) M.avisos.unshift('Vários desenhos selecionados: mostrando só o primeiro (' + it.nome + ').');
        M.pdfUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        escreverJanela(J, M);
      } catch (e) { try { J.close(); } catch (x) { } alert('Não foi possível montar o 3D.\n' + (e.message || e)); }
      b.disabled = false;
    })();
  };

  window.PPCPM_ENGENHARIA = { itens: function () { return ITENS; }, adicionarArquivos: adicionarArquivos };
})();
<\/script>
